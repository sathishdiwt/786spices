<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workers PPE Issue Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal: #1C1F26;
    --charcoal-2: #262A33;
    --safety-yellow: #FFC72C;
    --safety-orange: #FF6B35;
    --steel: #4A5568;
    --off-white: #F5F4F0;
    --card: #FFFFFF;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--charcoal);
    color:var(--off-white);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* Hazard stripe signature bar */
  .hazard-bar{
    height:14px;
    width:100%;
    background: repeating-linear-gradient(
      -45deg,
      var(--safety-yellow),
      var(--safety-yellow) 22px,
      var(--charcoal) 22px,
      var(--charcoal) 44px
    );
  }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding:36px 20px 28px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  header::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,199,44,0.08), transparent 45%),
      radial-gradient(circle at 80% 0%, rgba(255,107,53,0.08), transparent 40%);
    pointer-events:none;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Oswald', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--safety-yellow);
    margin-bottom:14px;
  }

  .eyebrow svg{ width:16px; height:16px; }

  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(26px, 5vw, 40px);
    line-height:1.15;
    margin:0 0 10px;
    letter-spacing:0.01em;
  }

  header p{
    font-size:15px;
    color:#B8BCC6;
    max-width:480px;
    margin:0 auto;
    line-height:1.5;
  }

  main{
    flex:1;
    display:flex;
    justify-content:center;
    padding:0 16px 48px;
  }

  .card{
    width:100%;
    max-width:680px;
    background:var(--card);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 50px -12px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
    position:relative;
  }

  .card-top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 20px;
    background:var(--charcoal-2);
    border-bottom:3px solid var(--safety-yellow);
  }

  .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--safety-orange);
  }

  .card-top span{
    font-family:'Oswald', sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#CBD0DA;
    font-weight:600;
  }

  .form-wrap{
    position:relative;
    width:100%;
    background:var(--off-white);
  }

  .form-wrap iframe{
    display:block;
    width:100%;
    border:none;
    height:1712px;
  }

  /* On narrower screens, Google Forms stacks fields more, so it needs more vertical room */
  @media (max-width: 480px){
    .form-wrap iframe{ height:2050px; }
  }

  @media (max-width: 360px){
    .form-wrap iframe{ height:2200px; }
  }

  .loader{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:var(--off-white);
    transition:opacity 0.4s ease;
  }

  .loader.hide{
    opacity:0;
    pointer-events:none;
  }

  .spinner{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid #E3E1D8;
    border-top-color:var(--safety-orange);
    animation:spin 0.8s linear infinite;
  }

  .loader p{
    font-family:'Oswald', sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--steel);
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  footer{
    text-align:center;
    padding:22px 16px 34px;
    font-size:12.5px;
    color:#6B7180;
  }

  footer strong{ color:#9AA0AD; }

  @media (prefers-reduced-motion: reduce){
    .spinner{ animation:none; }
  }
</style>
</head>
<body>
  <div class="hazard-bar"></div>

  <div class="page">
    <header>
      <div class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L3 6V11C3 16.5 6.8 21.4 12 23C17.2 21.4 21 16.5 21 11V6L12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M9 12L11 14L15.5 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Site Safety
      </div>
      <h1>Workers PPE Issue Request</h1>
      <p>Submit this form to request or record the issue of personal protective equipment. Fill in your details below — it only takes a minute.</p>
    </header>

    <main>
      <div class="card">
        <div class="card-top">
          <span class="dot"></span>
          <span>PPE Issue Form</span>
        </div>
        <div class="form-wrap">
          <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Loading form…</p>
          </div>
          <!--<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfdnWcgk5BBdsw6aPmX8IPc6JyIexnnblGlkg-JDIK-IsFsxA/viewform?embedded=true" width="640" height="1000" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>-->
          <iframe
            src=""https://docs.google.com/forms/d/e/1FAIpQLSfdnWcgk5BBdsw6aPmX8IPc6JyIexnnblGlkg-JDIK-IsFsxA/viewform?embedded=true"
            title="Workers PPE Issue Form"
            marginheight="0"
            marginwidth="0"
            onload="document.getElementById('loader').classList.add('hide')">
            Loading…
          </iframe>
        </div>
      </div>
    </main>

    <footer>
      Having trouble with the form? <strong>Contact your site admin.</strong>
    </footer>
  </div>
</body>
</html>
