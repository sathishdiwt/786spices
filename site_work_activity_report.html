<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif); 
    background: var(--bg-primary);
  }
  
  .container { 
    max-width: 900px; 
    margin: 0 auto; 
    padding: 1rem; 
  }
  
  @media (min-width: 768px) {
    .container { padding: 1.5rem; }
  }
  
  .header {
    background: linear-gradient(135deg, #D85A30 0%, #BA7517 100%);
    padding: 1.5rem;
    border-radius: 12px;
    color: white;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  
  @media (min-width: 768px) {
    .header { padding: 2rem; margin-bottom: 2rem; }
  }
  
  .header h1 { 
    font-size: 24px; 
    margin-bottom: 0.25rem; 
    font-weight: 600; 
  }
  
  @media (min-width: 768px) {
    .header h1 { font-size: 28px; margin-bottom: 0.5rem; }
  }
  
  .header p { font-size: 13px; opacity: 0.9; }
  
  .site-selector {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1.5rem;
  }
  
  @media (min-width: 768px) {
    .site-selector { padding: 1.5rem; margin-bottom: 2rem; }
  }
  
  .site-selector label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: 0.75rem;
  }
  
  @media (min-width: 768px) {
    .site-selector label { font-size: 15px; margin-bottom: 1rem; }
  }
  
  .site-selector select {
    width: 100%;
    padding: 0.875rem;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 16px; /* Prevents zoom on iOS */
    font-family: inherit;
  }
  
  .site-selector select:focus {
    outline: none;
    border-color: #D85A30;
    box-shadow: 0 0 0 3px rgba(216, 90, 48, 0.1);
  }
  
  .site-badge {
    display: inline-block;
    margin-top: 0.75rem;
    padding: 0.5rem 1rem;
    background: #FAECE7;
    border: 1px solid #D85A30;

    color: #993C1D;
    font-weight: 600;
    font-size: 13px;
  }
  
  .form-grid { 
    display: grid; 
    grid-template-columns: 1fr; 
    gap: 1rem; 
    margin-bottom: 1.5rem; 
  }
  
  @media (min-width: 768px) {
    .form-grid { gap: 1.5rem; margin-bottom: 2rem; }
  }
  
  .form-group {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
  }
  
  @media (min-width: 768px) {
    .form-group { padding: 1.25rem; }
  }
  
  .form-group label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: 0.75rem;
  }
  
  @media (min-width: 768px) {
    .form-group label { font-size: 15px; margin-bottom: 1rem; }
  }
  
  .form-group textarea {
    width: 100%;
    padding: 0.75rem;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 16px; /* Prevents zoom on iOS */
    font-family: inherit;
    margin-bottom: 1.25rem;
    min-height: 100px;
  }
  
  @media (min-width: 768px) {
    .form-group textarea { margin-bottom: 1.5rem; }
  }
  
  .form-group textarea:focus {
    outline: none;
    border-color: #D85A30;
    box-shadow: 0 0 0 3px rgba(216, 90, 48, 0.1);
  }
  
  .workers-section h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.75rem;
  }
  
  @media (min-width: 768px) {
    .workers-section h3 { font-size: 14px; margin-bottom: 1rem; }
  }
  
  .workers-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }
  
  @media (min-width: 600px) {
    .workers-grid { grid-template-columns: repeat(2, 1fr); }
  }
  
  @media (min-width: 768px) {
    .workers-grid { 
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
  }
  
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem;
  }
  
  .checkbox-group input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #1D9E75;
    flex-shrink: 0;
  }
  
  .checkbox-group label {
    margin: 0;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 400;
  }
  
  @media (min-width: 768px) {
    .checkbox-group label { font-size: 14px; }
  }
  
  .add-work-btn {
    width: 100%;
    padding: 0.875rem 1rem;
    background: #1D9E75;
    color: white;
    border: none;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
    min-height: 48px; /* Touch-friendly */
  }
  .add-work-btn:active { background: #0F6E56; }
  .add-work-btn:hover { background: #0F6E56; }
  
  .work-table {
    width: 100%;
    margin-bottom: 1.5rem;
    border-collapse: collapse;
    display: none;
  }
  
  @media (min-width: 768px) {
    .work-table {
      display: table;
      margin-bottom: 2rem;
    }
  }
  
  .work-table th {
    background: #E1F5EE;
    color: #0F6E56;
    padding: 1rem;
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid #5DCAA5;
    font-size: 13px;
  }
  
  @media (min-width: 768px) {
    .work-table th { font-size: 14px; }
  }
  
  .work-table td {
    padding: 1rem;
    border-bottom: 0.5px solid var(--border);
    font-size: 13px;
  }
  
  @media (min-width: 768px) {
    .work-table td { font-size: 14px; }
  }
  
  .work-table tr:hover { background: var(--surface-1); }
  
  /* Mobile card view */
  .work-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  
  @media (min-width: 768px) {
    .work-cards { display: none; }
  }
  
  .work-card {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
  }
  
  .work-card-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: 0.75rem;
  }
  
  .work-card-workers {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 0.75rem;
    line-height: 1.5;
  }
  
  .work-card-workers div {
    margin-bottom: 0.25rem;
  }
  
  .delete-btn {
    background: #E24B4A;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.2s;
    min-height: 40px;
    width: 100%;
  }
  
  @media (min-width: 768px) {
    .delete-btn { width: auto; min-height: auto; padding: 0.4rem 0.8rem; }
  }
  
  .delete-btn:active { background: #A32D2D; }
  .delete-btn:hover { background: #A32D2D; }
  
  .workers-list {
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-primary);
  }
  
  @media (min-width: 768px) {
    .workers-list { font-size: 13px; }
  }
  
  .workers-list li { margin-left: 1.5rem; }
  
  .actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  
  @media (min-width: 600px) {
    .actions { grid-template-columns: 1fr 1fr; gap: 1rem; }
  }
  
  @media (min-width: 768px) {
    .actions { margin-bottom: 2rem; }
  }
  
  .gen-report-btn, .clear-btn {
    padding: 0.875rem 1rem;
    border: none;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    min-height: 48px; /* Touch-friendly */
  }
  
  @media (min-width: 768px) {
    .gen-report-btn, .clear-btn { font-size: 15px; }
  }
  
  .gen-report-btn {
    background: #BA7517;
    color: white;
  }
  .gen-report-btn:active { background: #854F0B; }
  .gen-report-btn:hover { background: #854F0B; }
  
  .clear-btn {
    background: var(--surface-1);
    color: var(--text-primary);
    border: 0.5px solid var(--border);
  }
  .clear-btn:active { background: var(--border); }
  .clear-btn:hover { background: var(--border); }
  
  .report-box {
    background: #FAEEDA;
    border: 2px solid #BA7517;
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1.5rem;
    display: none;
  }
  
  @media (min-width: 768px) {
    .report-box { padding: 1.5rem; }
  }
  
  .report-box.show { display: block; }
  
  .report-box h3 {
    color: #854F0B;
    margin-bottom: 1rem;
    font-size: 15px;
  }
  
  @media (min-width: 768px) {
    .report-box h3 { font-size: 16px; }
  }
  
  .report-text {
    background: white;
    border: 0.5px solid #BA7517;
    border-radius: 8px;
    padding: 1rem;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #412402;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 1rem;
  }
  
  @media (min-width: 768px) {
    .report-text { font-size: 13px; max-height: 400px; margin-bottom: 0; }
  }
  
  .copy-btn {
    width: 100%;
    padding: 0.875rem;
    background: #BA7517;
    color: white;
    border: none;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    min-height: 48px;
  }
  
  @media (min-width: 768px) {
    .copy-btn { font-size: 15px; min-height: auto; }
  }
  
  .copy-btn:active { background: #854F0B; }
  .copy-btn:hover { background: #854F0B; }
  
  .badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    margin-right: 0.25rem;
  }
  .badge-coral { background: #FAECE7; color: #993C1D; }
  .badge-teal { background: #E1F5EE; color: #0F6E56; }
  
  /* Utilities */
  #entries-section h2 {
    font-size: 16px;
    color: var(--text-primary);
    margin-bottom: 1rem;
  }
  
  @media (min-width: 768px) {
    #entries-section h2 { font-size: 18px; }
  }
</style>

<div class="container">

      <button class="add-work-btn" onclick="addWork()">✓ Add Work Entry</button>

  <div id="entries-section" style="display: none; margin-bottom: 1.5rem;">

<script>
  let entries = [];
  
  function updateSiteBadge() {
    const site = document.getElementById('site').value;
    const badge = document.getElementById('siteBadge');
    if (site) {
      document.getElementById('siteDisplay').textContent = site;
      badge.style.display = 'block';
    } else {
      badge.style.display = 'none';
    }
  }
  
  function getSelectedWorkers() {
    const workers = [];
    for (let i = 1; i <= 17; i++) {
      const checkbox = document.getElementById('w' + i);
      if (checkbox.checked) {
        workers.push(checkbox.value);
      }
    }
    return workers;
  }
  
  function clearWorkerCheckboxes() {
    for (let i = 1; i <= 17; i++) {
      document.getElementById('w' + i).checked = false;
    }
  }
  
  function addWork() {
    const site = document.getElementById('site').value;
    const work = document.getElementById('work').value.trim();
    const workers = getSelectedWorkers();
    
    if (!site) {
      alert('Please select a site first');
      return;
    }
    if (!work) {
      alert('Please enter work description');
      return;
    }
    if (workers.length === 0) {
      alert('Please select at least one worker');
      return;
    }
    
    entries.push({ site, work, workers });
    document.getElementById('work').value = '';
    clearWorkerCheckboxes();
    updateTable();
  }
  
  function updateTable() {
    const tbody = document.getElementById('entriesBody');
    const cards = document.getElementById('workCards');
    const section = document.getElementById('entries-section');
    const actions = document.getElementById('actions-section');
    
    if (entries.length === 0) {
      section.style.display = 'none';
      actions.style.display = 'none';
      return;
    }
    
    section.style.display = 'block';
    actions.style.display = 'grid';
    
    // Desktop table
    tbody.innerHTML = entries.map((e, i) => `
      <tr>
        <td><strong>${e.work}</strong></td>
        <td>
          <div class="workers-list">
            ${e.workers.map(w => `<div>• ${w}</div>`).join('')}
          </div>
        </td>
        <td style="text-align: center;"><button class="delete-btn" onclick="deleteEntry(${i})">Delete</button></td>
      </tr>
    `).join('');
    
    // Mobile cards
    cards.innerHTML = entries.map((e, i) => `
      <div class="work-card">
        <div class="work-card-title">${e.work}</div>
        <div class="work-card-workers">
          ${e.workers.map(w => `<div>• ${w}</div>`).join('')}
        </div>
        <button class="delete-btn" onclick="deleteEntry(${i})">Delete Entry</button>
      </div>
    `).join('');
  }
  
  function deleteEntry(index) {
    entries.splice(index, 1);
    updateTable();
  }
  
  function generateReport() {
    if (entries.length === 0) {
      alert('No work entries to report');
      return;
    }
    
    const site = entries[0].site;
    const today = new Date().toLocaleDateString('en-GB');
    let report = `PIXELS CONNECT\nSITE WORK ACTIVITY\n`;
    report += `Date: ${today}\n`;
    report += `Site: ${site}\n`;
    report += `${'➖'.repeat(12)}\n\n`;
    
    entries.forEach((e, idx) => {
      report += `Task #${idx + 1}: ${e.work}\n`;
      report += `Assigned:\n`;
      e.workers.forEach(w => {
        report += `  • ${w}\n`;
      });
      report += `\n`;
    });
    
    report += `${'='.repeat(30)}\n`;
    report += `Total Work Tasks: ${entries.length}\n`;
    const totalWorkers = new Set();
    entries.forEach(e => {
      e.workers.forEach(w => totalWorkers.add(w));
    });
    report += `Total Workers Involved: ${totalWorkers.size}\n`;
      
    document.getElementById('reportText').textContent = report;
    document.getElementById('reportBox').classList.add('show');
    document.getElementById('reportBox').scrollIntoView({ behavior: 'smooth' });
  }
  
  function copyReport() {
    const text = document.getElementById('reportText').textContent;
    const btn = document.querySelector('.copy-btn');
    const oldText = btn.textContent;
    
    // Try modern clipboard API first
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => {
          btn.textContent = '✓ Copied!';
          setTimeout(() => { btn.textContent = oldText; }, 2000);
        })
        .catch(() => {
          // Fallback to older method
          fallbackCopyToClipboard(text, btn, oldText);
        });
    } else {
      // Fallback for older browsers
      fallbackCopyToClipboard(text, btn, oldText);
    }
  }
  
  function fallbackCopyToClipboard(text, btn, oldText) {
    try {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      const successful = document.execCommand('copy');
      document.body.removeChild(textarea);
      
      if (successful) {
        btn.textContent = '✓ Copied!';
        setTimeout(() => { btn.textContent = oldText; }, 2000);
      } else {
        alert('Unable to copy. Please try again or copy manually.');
      }
    } catch (err) {
      alert('Unable to copy. Please try again or copy manually.');
    }
  }
  
  function clearAll() {
    if (confirm('Are you sure? This will clear all entries.')) {
      entries = [];
      document.getElementById('entriesBody').innerHTML = '';
      document.getElementById('workCards').innerHTML = '';
      document.getElementById('entries-section').style.display = 'none';
      document.getElementById('actions-section').style.display = 'none';
      document.getElementById('reportBox').classList.remove('show');
    }
  }
</script>
