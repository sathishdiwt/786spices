        const clearAllBtn = document.getElementById('clearAll');
        const orderPreview = document.getElementById('orderPreview');
        const successMsg = document.getElementById('successMsg');

        function render() {
            container.innerHTML = filtered.map(p => {
                const qty = quantities[p.id] || 0;
                return `
                    <div class="product-row">
                        <div>
                            <div class="product-name">${p.name}</div>
                            <div class="product-size">${p.size}</div>
                            <div class="product-price">SGD ${p.price.toFixed(2)}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${p.id}, -1)">−</button>
                            <input type="number" class="qty-input" id="qty-${p.id}" value="${qty}" onchange="setQty(${p.id}, this.value)" min="0" />
                            <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
                        </div>
                        <div class="line-total">${qty > 0 ? `SGD ${(p.price * qty).toFixed(2)}` : '−'}</div>
                    </div>
                `;
            }).join('');
            updateSummary();
        }

        window.updateQty = (id, delta) => {
            quantities[id] = Math.max(0, (quantities[id] || 0) + delta);
            document.getElementById(`qty-${id}`).value = quantities[id];
            updateSummary();
        };

        window.setQty = (id, val) => {
            quantities[id] = Math.max(0, parseInt(val) || 0);
            updateSummary();
        };

        function updateSummary() {
            let count = 0, total = 0;
            Object.keys(quantities).forEach(id => {
                const q = quantities[id];
                if (q > 0) {
                    count += q;
                    const p = products.find(x => x.id === parseInt(id));
                    total += p.price * q;
                }
            });
            itemCount.textContent = count;
            totalPrice.textContent = `SGD ${total.toFixed(2)}`;
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cat = categoryFilter.value;
            filtered = products.filter(p => 
                (p.name.toLowerCase().includes(term)) &&
                (!cat || p.category === cat)
            );
            render();
        });

        categoryFilter.addEventListener('change', (e) => {
            const term = searchInput.value.toLowerCase();
            const cat = e.target.value;
            filtered = products.filter(p => 
                (p.name.toLowerCase().includes(term)) &&
                (!cat || p.category === cat)
            );
            render();
        });

        generateWhatsAppBtn.addEventListener('click', () => {
            let msg = '🇸🇬 *786 Spices Wholesale Order*\n\n';
            let lineTotal = 0, itemTotal = 0;
            let hasItems = false;
            
            products.forEach(p => {
                const q = quantities[p.id];
                if (q > 0) {
                    hasItems = true;
                    const subtotal = p.price * q;
                    msg += `${p.name}\nQty: ${q} | SGD ${p.price.toFixed(2)} = SGD ${subtotal.toFixed(2)}\n\n`;
                    lineTotal += subtotal;
                    itemTotal += q;
                }
            });
            
            if (!hasItems) {
                alert('Please select at least one item before sending to WhatsApp.');
                return;
            }
            
            msg += `*Total items:* ${itemTotal}\n*Total price (excl. GST):* SGD ${lineTotal.toFixed(2)}\n\n`;
            msg += `Ordered: ${new Date().toLocaleDateString('en-SG')}`;
            
            const encoded = encodeURIComponent(msg);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');
        });

        copyOrderBtn.addEventListener('click', () => {
            let msg = '786 Spices Wholesale Order\n\n';
            let lineTotal = 0, itemTotal = 0;
            let hasItems = false;
            
            products.forEach(p => {
                const q = quantities[p.id];
                if (q > 0) {
                    hasItems = true;
                    const subtotal = p.price * q;
                    msg += `${p.name} | Qty: ${q} | SGD ${p.price.toFixed(2)} = SGD ${subtotal.toFixed(2)}\n`;
                    lineTotal += subtotal;
                    itemTotal += q;
                }
            });
            
            if (!hasItems) {
                alert('Please select at least one item before copying.');
                return;
            }
            
            msg += `\nTotal items: ${itemTotal}\nTotal price (excl. GST): SGD ${lineTotal.toFixed(2)}\nOrdered: ${new Date().toLocaleDateString('en-SG')}`;
            
            navigator.clipboard.writeText(msg).then(() => {
                orderPreview.textContent = msg;
                orderPreview.classList.add('show');
                successMsg.classList.add('show');
                copyOrderBtn.textContent = '✓ Copied!';
                setTimeout(() => { 
                    copyOrderBtn.innerHTML = '<i class="ti ti-copy icon"></i> Copy';
                    successMsg.classList.remove('show');
                }, 3000);
            }).catch(() => {
                alert('Failed to copy to clipboard. Please try again.');
            });
        });

        clearAllBtn.addEventListener('click', () => {
            if (Object.values(quantities).some(q => q > 0)) {
                quantities = {};
                render();
                orderPreview.classList.remove('show');
            }
        });

        render();
    </script>
</body>
</html>
