<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Staff Attendance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230D5F7A'/%3E%3Cpath d='M16 8v8l5 3' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column; header, tab bar, then the Clock tab as punch card + today list. Tables scroll inside their own wrapper.
   Palette: cool slate paper, navy ink, one teal accent. Green = IN, amber = OUT. */
:root{
  color-scheme:light;
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#14202B; --muted:#566676; --line:#D2D9E0;
  --accent:#0D5F7A; --on-accent:#FFFFFF;
  --in:#1B7F4F; --in-soft:#DCF1E5; --on-in:#FFFFFF;
  --out:#A35A08; --out-soft:#FAEAD1; --on-out:#FFFFFF;
  --bad:#B3261E; --bad-soft:#FBE3E1;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E151B; --surface:#16202A; --surface-2:#1C2833; --ink:#E5ECF2; --muted:#93A3B2; --line:#2A3846;
    --accent:#5BC0DE; --on-accent:#06222B;
    --in:#4CC38A; --in-soft:#143222; --on-in:#05180E;
    --out:#E8A24A; --out-soft:#35260F; --on-out:#2A1700;
    --bad:#F28B82; --bad-soft:#3A1B19;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(56px + env(safe-area-inset-bottom,0px));min-height:100vh}
.wrap{max-width:980px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:18px;font-weight:700}
p{margin:0}
button{font-family:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:22px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.who .nm{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.role{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.role.admin{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{appearance:none;background:none;border:0;padding:11px 14px;font:600 14px var(--body);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.narrow{max-width:420px;margin-inline:auto}

.eyebrow{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.clock{font:500 clamp(44px,11vw,72px)/1.05 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-block:8px 12px}
.status{display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:18px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.status.in .dot{background:var(--in)}
@media (prefers-reduced-motion:no-preference){.status.in .dot{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.stub{border-top:1px dashed var(--line);margin-block:2px 16px}
.punchbtn{width:100%;min-height:68px;border:0;border-radius:10px;cursor:pointer;font:700 22px var(--display)}
.punchbtn.in{background:var(--in);color:var(--on-in)}
.punchbtn.out{background:var(--out);color:var(--on-out)}
.punchbtn:disabled{opacity:.5;cursor:wait}
.hint{color:var(--muted);font-size:13px;margin-top:10px}

label{display:block;font:600 12px var(--body);letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font:600 14px var(--body);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%;margin-top:18px;padding:12px}
.btn.small{padding:5px 10px;font-size:13px}
.linkbtn{appearance:none;background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;padding:0;text-decoration:underline}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:34px;height:34px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}

.notice{padding:12px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.notice.err{background:var(--bad-soft);border-color:var(--bad)}
.gpsline{font-size:13px;margin-top:12px;color:var(--muted)}
.gpsline.err{color:var(--bad)}
.coords{font:400 12px var(--mono);color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font:600 11px var(--body);letter-spacing:.03em;white-space:nowrap}
.pill.in{background:var(--in-soft);color:var(--in)}
.pill.out{background:var(--out-soft);color:var(--out)}
.pill.manual{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.monthnav{display:flex;align-items:center;gap:10px}
.monthnav strong{font:700 18px var(--display);min-width:150px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile .v{font:500 26px var(--mono);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.tile .k{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.chart{position:relative;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line)}
.bars i{flex:1;min-width:2px;background:var(--accent);border-radius:2px 2px 0 0;opacity:.9}
.bars i.zero{background:var(--line);height:2px!important}
.ref{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);opacity:.6;pointer-events:none}
.ref span{position:absolute;right:0;top:-18px;font:400 11px var(--mono);color:var(--muted)}
.axis{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--muted);margin-top:4px}

.tablewrap{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;min-width:600px}
th{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mono,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.dim{color:var(--muted)}
.loc div{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-block:1px}
.loc small{color:var(--muted);font-size:12px;min-width:26px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 16px var(--display);margin-bottom:4px}
.sec{margin-top:20px}
.sec>h2{margin-bottom:10px}
.fieldrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.fieldrow{grid-template-columns:minmax(0,1fr)}}
.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.inline input{width:auto;flex:1 1 150px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);z-index:10}
#toast.err{background:var(--bad);color:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ============ 1. PASTE YOUR SUPABASE DETAILS HERE (see README.md) ============ */
var CFG={
  url:'https://jofbyyznznfcvhebpwsx.supabase.co',          /* e.g. https://abcdefgh.supabase.co */
  key:'sb_publishable_IsMcjJM6whAVPgjpJV4cGg_yVxgIce-'       /* the publishable (anon) key, safe to put in a web page */
};
/* =============================================================================== */

var TZ='Asia/Singapore';
var app=document.getElementById('app');

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('en-SG',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});}
function fmtDay(ds){var p=ds.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'});}
function fmtDur(ms){var m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+'h '+pad(m%60)+'m';}
function todaySG(){return new Date().toLocaleDateString('en-CA',{timeZone:TZ});}
function nowParts(){var p=todaySG().split('-').map(Number);return {y:p[0],m:p[1]-1};}
var CUR=nowParts();
function monthLabel(mo){return new Date(mo.y,mo.m,1).toLocaleDateString('en-SG',{month:'long',year:'numeric'});}
function shift(mo,d){var dt=new Date(mo.y,mo.m+d,1);return {y:dt.getFullYear(),m:dt.getMonth()};}
function isCur(mo){return mo.y===CUR.y&&mo.m===CUR.m;}
function lastDay(mo){return new Date(mo.y,mo.m+1,0).getDate();}
function monthFrom(mo){return mo.y+'-'+pad(mo.m+1)+'-01';}
function monthTo(mo){return mo.y+'-'+pad(mo.m+1)+'-'+pad(lastDay(mo));}
function durOf(r){return r.clock_out?new Date(r.clock_out)-new Date(r.clock_in):null;}
function csvCell(v){v=v==null?'':String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function mapUrl(lat,lng){return 'https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lng+'#map=18/'+lat+'/'+lng;}

var ERR={
  bad_pin:'Wrong PIN or passcode.',
  locked:'Too many wrong tries. Wait 15 minutes and try again.',
  no_staff:'This staff account is not active. Ask your admin.',
  already_in:'You are already clocked in.',
  not_in:'You are not clocked in.',
  no_place:'Could not work out where you are. Try again.',
  weak_pin:'Use 4 to 8 digits for the PIN.',
  same_pin:'Choose a PIN different from your current one.',
  bad_time:'That time must be after the clock-in and not in the future.',
  not_open:'That record is already clocked out.',
  no_name:'Enter a name.',
  exists:'A staff member with that name already exists.'
};
function errMsg(e){
  if(e&&e.app)return ERR[e.app]||'Something went wrong.';
  if(e&&e.code==='unsupported')return 'This browser cannot share your location. Open the page in Chrome or Safari.';
  if(e&&typeof e.code==='number'){
    if(e.code===1)return 'Location is blocked. Allow location for this site in your browser settings, then try again.';
    if(e.code===2)return 'Your position is not available. Move to an open area, check GPS is on, and try again.';
    if(e.code===3)return 'Finding your position took too long. Try again.';
  }
  return 'Could not reach the server. Check your internet connection and try again.';
}
var toastTimer=null;
function toast(msg,kind){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className=kind==='err'?'err':'';el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true;},kind==='err'?6000:2800);
}

/* ---------- server calls ---------- */
async function rpc(fn,args){
  var res=await fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{
    method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.key},body:JSON.stringify(args||{})
  });
  var j=null;try{j=await res.json();}catch(e){}
  if(!res.ok)throw new Error((j&&(j.message||j.hint))||('HTTP '+res.status));
  return j;
}
function configured(){return CFG.url.indexOf('PASTE_')<0&&CFG.key.indexOf('PASTE_')<0;}

/* ---------- state ---------- */
var S={
  view:'boot',mode:'staff',staffList:[],busy:false,
  form:{staffId:'',pin:'',adminPin:'',newPin:'',newPin2:'',err:''},
  role:null,me:null,tab:'clock',
  month:{y:CUR.y,m:CUR.m},report:[],reportErr:'',reportLoading:false,
  gps:{status:'idle',text:''},
  adm:{pin:'',month:{y:CUR.y,m:CUR.m},staff:'all',data:{staff:[],records:[]},loading:false,err:'',resetFor:null,resetVal:'',fixFor:null,fixVal:'',add:{name:'',job:'',pass:'',err:''}}
};

function saveSess(){try{sessionStorage.setItem('att',JSON.stringify(S.role==='admin'?{role:'admin',pin:S.adm.pin}:{role:'staff',id:S.me.id,pin:S.me.pin}));}catch(e){}}
function clearSess(){try{sessionStorage.removeItem('att');}catch(e){}}
function signOut(){clearSess();S.role=null;S.me=null;S.view='login';S.tab='clock';S.form={staffId:S.form.staffId,pin:'',adminPin:'',newPin:'',newPin2:'',err:''};S.report=[];S.adm.data={staff:[],records:[]};render();}

/* ---------- shared view pieces ---------- */
function tag(m){return m==='gps'?'<span class="pill in">GPS</span>':'<span class="pill manual">'+(m==='admin'?'Admin':'Manual')+'</span>';}
function placeLine(label,place,method,lat,lng){
  if(!place)return '';
  var link=(lat!=null&&lng!=null)?' <a href="'+mapUrl(lat,lng)+'" target="_blank" rel="noopener">map</a>':'';
  return '<div><small>'+label+'</small><span>'+esc(place)+link+'</span>'+tag(method)+'</div>';
}
function locCell(r){
  var h=placeLine('In',r.in_place,r.in_method,r.in_lat,r.in_lng)+placeLine('Out',r.out_place,r.out_method,r.out_lat,r.out_lng);
  return '<div class="loc">'+(h||'<span class="dim">No location</span>')+'</div>';
}
function hoursCell(r){var d=durOf(r);return d!=null?'<span class="mono">'+fmtDur(d)+'</span>':'<span class="pill in">In progress</span>';}
function monthNav(mo,p){
  return '<div class="monthnav"><button class="iconbtn" data-act="'+p+'Prev" aria-label="Previous month">&#8249;</button><strong>'+esc(monthLabel(mo))+'</strong><button class="iconbtn" data-act="'+p+'Next" aria-label="Next month"'+(isCur(mo)?' disabled':'')+'>&#8250;</button></div>';
}
function tile(k,v){return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>';}
function summarize(list){
  var days={},n=0,ms=0,open=0;
  list.forEach(function(r){if(!days[r.work_date]){days[r.work_date]=1;n++;}var d=durOf(r);if(d!=null)ms+=d;else open++;});
  return {days:n,ms:ms,avg:n?ms/n:0,open:open};
}
function header(){
  var nm=S.role==='admin'?'':(S.me?S.me.name:'');
  return '<header class="top"><div class="brand">Staff Attendance</div><div class="who">'+
    (nm?'<span class="nm">'+esc(nm)+'</span>':'')+
    (S.role?'<span class="role'+(S.role==='admin'?' admin':'')+'">'+(S.role==='admin'?'Admin':'Staff')+'</span><button class="btn small" data-act="signOut">Sign out</button>':'')+
    '</div></header>';
}
function tabs(list){
  return '<div class="tabs" role="tablist">'+list.map(function(x){return '<button class="tab" role="tab" data-tab="'+x[0]+'" aria-selected="'+(S.tab===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
}

/* ---------- login ---------- */
function loginView(){
  var f=S.form;
  if(S.mode==='admin'){
    return header()+'<div class="card narrow"><h2>Admin sign in</h2><form data-form="adminLogin"><label for="adminPin">Admin passcode</label><input id="adminPin" type="password" autocomplete="current-password" value="'+esc(f.adminPin)+'">'+
      (f.err?'<p class="notice err" style="margin-top:12px">'+esc(f.err)+'</p>':'')+
      '<button class="btn primary block" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Signing in&hellip;':'Sign in')+'</button></form>'+
      '<p style="margin-top:16px"><button class="linkbtn" data-act="modeStaff">Staff sign in</button></p></div>';
  }
  var opts='<option value="">Choose your name</option>'+S.staffList.map(function(s){return '<option value="'+s.id+'"'+(String(f.staffId)===String(s.id)?' selected':'')+'>'+esc(s.name)+'</option>';}).join('');
  return header()+'<div class="card narrow"><h2>Sign in to clock in and out</h2><form data-form="login"><label for="staffId">Your name</label><select id="staffId">'+opts+'</select>'+
    '<label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" value="'+esc(f.pin)+'">'+
    (f.err?'<p class="notice err" style="margin-top:12px">'+esc(f.err)+'</p>':'')+
    '<button class="btn primary block" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Signing in&hellip;':'Sign in')+'</button></form>'+
    '<p class="hint">First time? Your starting PIN is 1234. You will choose a new one right after.</p>'+
    '<p style="margin-top:16px"><button class="linkbtn" data-act="modeAdmin">Admin sign in</button></p></div>';
}
function changePinView(){
  var f=S.form;
  return header()+'<div class="card narrow"><h2>Choose your own PIN</h2><p class="hint" style="margin-top:6px">Use 4 to 8 digits. You will use it every time you sign in.</p><form data-form="changePin">'+
    '<label for="newPin">New PIN</label><input id="newPin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" value="'+esc(f.newPin)+'">'+
    '<label for="newPin2">Type it again</label><input id="newPin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" value="'+esc(f.newPin2)+'">'+
    (f.err?'<p class="notice err" style="margin-top:12px">'+esc(f.err)+'</p>':'')+
    '<button class="btn primary block" type="submit"'+(S.busy?' disabled':'')+'>Save PIN</button></form></div>';
}

/* ---------- staff: clock ---------- */
function clockTab(){
  var o=S.me.open,g=S.gps;
  var today=new Date().toLocaleDateString('en-SG',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var gpsText={idle:'Your GPS location is saved with every clock-in and clock-out.',locating:'Finding your position&hellip;',naming:'Looking up the place name&hellip;'}[g.status]||'';
  var gl=g.status==='error'?'<p class="gpsline err">'+esc(g.text)+'</p>':g.status==='done'?'<p class="gpsline">'+esc(g.text)+'</p>':'<p class="gpsline">'+gpsText+'</p>';
  var punch='<section class="card"><div class="eyebrow">'+esc(today)+'</div><div class="clock" id="clk">--:--:--</div>'+
    '<div class="status '+(o?'in':'out')+'"><span class="dot"></span>'+(o?'<span>Clocked in since <span class="mono">'+fmtTime(o.clock_in)+'</span> &middot; <span class="mono" id="elapsed">'+fmtDur(Date.now()-new Date(o.clock_in))+'</span></span>':'<span>Not clocked in</span>')+'</div>'+
    '<div class="stub"></div><button class="punchbtn '+(o?'out':'in')+'" data-act="punch"'+(S.busy?' disabled':'')+'>'+(S.busy?'Please wait&hellip;':(o?'Clock out':'Clock in'))+'</button>'+gl+'</section>';
  var td=todaySG(),mine=S.report.filter(function(r){return r.work_date===td;});

function admModel(){
  var A=S.adm,by={};
  A.data.records.forEach(function(r){(by[r.staff_id]=by[r.staff_id]||[]).push(r);});
  var summary=A.data.staff.filter(function(s){return (s.active||by[s.id])&&(A.staff==='all'||String(A.staff)===String(s.id));}).map(function(s){
    var list=(by[s.id]||[]).slice().sort(function(a,b){return new Date(a.clock_in)-new Date(b.clock_in);}),open=null;
    list.forEach(function(r){if(!r.clock_out)open=r;});
    return {s:s,list:list,sum:summarize(list),open:open,last:list.length?list[list.length-1]:null};
  });
  var detail=[];summary.forEach(function(x){x.list.forEach(function(r){detail.push(r);});});
  detail.sort(function(a,b){return new Date(b.clock_in)-new Date(a.clock_in);});
  return {summary:summary,detail:detail};
}

/* ---------- GPS ---------- */
function getPos(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation){rej({code:'unsupported'});return;}
    navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  });
}
async function placeName(lat,lng){
  var fallback=lat.toFixed(5)+', '+lng.toFixed(5);
  try{
    var ctl=new AbortController(),t=setTimeout(function(){ctl.abort();},7000);
    var r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat='+lat+'&lon='+lng,{headers:{'Accept':'application/json'},signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok)return fallback;
    var j=await r.json(),a=j.address||{};
    var street=((a.house_number?a.house_number+' ':'')+(a.road||'')).trim();
    var parts=[j.name&&j.name!==a.road?j.name:'',street,a.suburb||a.neighbourhood||'',a.postcode||''].filter(Boolean);
    var seen={},out=[];parts.forEach(function(p){if(!seen[p]){seen[p]=1;out.push(p);}});
    var s=out.join(', ');
    if(!s&&j.display_name)s=j.display_name.split(',').slice(0,3).join(',').trim();
    return s||fallback;
  }catch(e){return fallback;}
}

/* ---------- actions ---------- */
function appFail(r){return {app:r&&r.error};}
function authFail(e){
  if(e&&e.app&&(e.app==='bad_pin'||e.app==='no_staff'||e.app==='locked')){
    toast(ERR[e.app],'err');signOut();return true;
  }
  return false;
}
async function loadStaffList(){
  try{S.staffList=await rpc('app_staff_list');}catch(e){S.staffList=[];S.form.err=errMsg(e);}
}
async function loadReport(){
  if(!S.me)return;
  S.reportLoading=true;S.reportErr='';render();
  try{
    var r=await rpc('app_my_report',{p_id:S.me.id,p_pin:S.me.pin,p_year:S.month.y,p_month:S.month.m+1});
    if(!r.ok)throw appFail(r);
    S.report=r.records;
  }catch(e){if(!authFail(e))S.reportErr=errMsg(e);}
  S.reportLoading=false;render();
}
async function doLogin(){
  var f=S.form;
  if(!f.staffId||!f.pin){f.err='Choose your name and enter your PIN.';render();return;}
  S.busy=true;f.err='';render();
  try{
    var id=Number(f.staffId),r=await rpc('app_login',{p_id:id,p_pin:f.pin});
    if(!r.ok)throw appFail(r);
    S.role='staff';S.me={id:id,pin:f.pin,name:r.name,job:r.job_title,must_change:r.must_change,open:r.open};
    saveSess();f.pin='';S.tab='clock';S.month={y:CUR.y,m:CUR.m};
    S.view=r.must_change?'changepin':'staff';
    S.busy=false;render();
    if(!r.must_change)loadReport();
    return;
  }catch(e){f.err=errMsg(e);}
  S.busy=false;render();
}
async function doChangePin(){
  var f=S.form;
  if(f.newPin!==f.newPin2){f.err='The two PINs do not match.';render();return;}
  S.busy=true;f.err='';render();
  try{
    var r=await rpc('app_change_pin',{p_id:S.me.id,p_pin:S.me.pin,p_new:f.newPin});
    if(!r.ok)throw appFail(r);
    S.me.pin=f.newPin;S.me.must_change=false;saveSess();f.newPin='';f.newPin2='';
    S.view='staff';toast('PIN saved');S.busy=false;render();loadReport();return;
  }catch(e){f.err=errMsg(e);}
  S.busy=false;render();
}
async function doAdminLogin(){
  var f=S.form;
  if(!f.adminPin){f.err='Enter the admin passcode.';render();return;}
  S.busy=true;f.err='';render();
  S.adm.pin=f.adminPin;S.adm.month={y:CUR.y,m:CUR.m};S.adm.staff='all';
  try{
    var r=await rpc('app_admin_load',{p_admin_pin:S.adm.pin,p_from:monthFrom(S.adm.month),p_to:monthTo(S.adm.month)});
    if(!r.ok)throw appFail(r);
    S.adm.data=r;S.role='admin';S.view='admin';S.tab='overview';saveSess();f.adminPin='';
  }catch(e){f.err=errMsg(e);S.adm.pin='';}
  S.busy=false;render();
}
async function admLoad(){
  var A=S.adm;A.loading=true;A.err='';render();
  try{
    var r=await rpc('app_admin_load',{p_admin_pin:A.pin,p_from:monthFrom(A.month),p_to:monthTo(A.month)});
    if(!r.ok)throw appFail(r);
    A.data=r;
  }catch(e){if(!authFail(e))A.err=errMsg(e);}
  A.loading=false;render();
}
async function admCall(fn,args,okMsg){
  try{
    var r=await rpc(fn,Object.assign({p_admin_pin:S.adm.pin},args));
    if(!r.ok)throw appFail(r);
    if(okMsg)toast(okMsg);
    return true;
  }catch(e){if(!authFail(e))toast(errMsg(e),'err');return false;}
}
async function punch(){
  if(S.busy)return;
  var open=S.me.open;
  S.busy=true;S.gps={status:'locating',text:''};render();
  try{
    var pos=await getPos(),c=pos.coords;
    S.gps={status:'naming',text:''};render();
    var place=await placeName(c.latitude,c.longitude);
    var r=await rpc(open?'app_clock_out':'app_clock_in',{p_id:S.me.id,p_pin:S.me.pin,p_lat:c.latitude,p_lng:c.longitude,p_acc:c.accuracy,p_place:place,p_method:'gps'});
    if(!r.ok)throw appFail(r);
    S.me.open=open?null:r.record;
    var when=new Date().toLocaleTimeString('en-SG',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
    S.gps={status:'done',text:(open?'Clocked out':'Clocked in')+' at '+when+' at '+place+' (accuracy about '+Math.round(c.accuracy)+' m).'};
    toast(open?'Clocked out':'Clocked in');
    S.month={y:CUR.y,m:CUR.m};
    S.busy=false;render();loadReport();return;
  }catch(e){
    if(!authFail(e))S.gps={status:'error',text:errMsg(e)};
  }
  S.busy=false;render();
}
async function exportAll(){
  var M=admModel(),A=S.adm;
  var head=['Staff','Job title','Date','Clock in','Clock out','Hours','In place','In method','In lat','In lng','Out place','Out method','Out lat','Out lng'];
  var rows=M.detail.map(function(r){var d=durOf(r);return [r.name,r.job_title||'',r.work_date,fmtTime(r.clock_in),r.clock_out?fmtTime(r.clock_out):'',d!=null?(d/3600000).toFixed(2):'',r.in_place||'',r.in_method||'',r.in_lat==null?'':r.in_lat,r.in_lng==null?'':r.in_lng,r.out_place||'',r.out_method||'',r.out_lat==null?'':r.out_lat,r.out_lng==null?'':r.out_lng];});
  var csv='﻿'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',');}).join('\r\n');

  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ---------- events ---------- */

  var t=e.target.closest('[data-tab]');
  if(t){S.tab=t.getAttribute('data-tab');render();if(S.view==='staff'&&S.tab==='report')loadReport();return;}
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var act=b.getAttribute('data-act'),id=Number(b.getAttribute('data-id'));
  var A=S.adm;
  if(act==='signOut')signOut();
  else if(act==='modeAdmin'){S.mode='admin';S.form.err='';render();}
  else if(act==='modeStaff'){S.mode='staff';S.form.err='';render();}
  else if(act==='punch')punch();
  else if(act==='mPrev'){S.month=shift(S.month,-1);loadReport();}
  else if(act==='mNext'&&!isCur(S.month)){S.month=shift(S.month,1);loadReport();}
  else if(act==='aPrev'){A.month=shift(A.month,-1);admLoad();}
  else if(act==='aNext'&&!isCur(A.month)){A.month=shift(A.month,1);admLoad();}
  else if(act==='aRefresh')admLoad();
  else if(act==='exportAll')exportAll();
  else if(act==='resetAsk'){A.resetFor=id;A.resetVal='';render();}
  else if(act==='resetCancel'){A.resetFor=null;render();}
  else if(act==='resetSave'){
    if(await admCall('app_admin_reset_pin',{p_staff_id:id,p_new:A.resetVal},'PIN reset. They choose a new one at next sign in.')){A.resetFor=null;admLoad();}
  }
  else if(act==='toggleActive'){
    if(await admCall('app_admin_set_active',{p_staff_id:id,p_active:b.getAttribute('data-active')!=='1'},'Updated'))admLoad();
  }
  else if(act==='fixAsk'){A.fixFor=id;A.fixVal=b.getAttribute('data-date')+'T17:30';render();}
  else if(act==='fixCancel'){A.fixFor=null;render();}
  else if(act==='fixSave'){
    if(!A.fixVal){toast('Pick the clock-out time.','err');return;}
    if(await admCall('app_admin_set_clock_out',{p_record_id:id,p_clock_out:A.fixVal+':00+08:00'},'Clock-out saved')){A.fixFor=null;admLoad();}
  }
});

      if(!r.ok)throw appFail(r);
      S.adm.add={name:'',job:'',pass:'',err:''};toast('Staff added');admLoad();
    }catch(err){if(!authFail(err)){ad.err=errMsg(err);render();}}
  }
});

/* ---------- start ---------- */
async function boot(){
  render();
  if(!configured()){S.view='setup';render();return;}
  await loadStaffList();
  var sess=null;try{sess=JSON.parse(sessionStorage.getItem('att')||'null');}catch(e){}
  S.view='login';
  if(sess&&sess.role==='staff'){S.form.staffId=sess.id;S.form.pin=sess.pin;await doLogin();return;}
  if(sess&&sess.role==='admin'){S.mode='admin';S.form.adminPin=sess.pin;await doAdminLogin();return;}
  render();
}
boot();
})();
</script>
