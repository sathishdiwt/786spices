<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Muri Shop — Cash Locker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-line:#E4D9C2;
    --ink:#22301F;
    --ink-soft:#5B6B54;
    --green:#2F6E4F;
    --green-dark:#204F39;
    --rust:#B5502C;
    --rust-dark:#8E3D22;
    --gold:#C79A3D;
    --card-shadow: 0 1px 0 rgba(34,48,31,0.06);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 10% -10%, #F3ECD8 0%, transparent 45%),
      var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    padding:20px 14px 48px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:460px;
    margin:0 auto;
  }

  header{
    padding:6px 4px 20px;
    border-bottom:2px solid var(--ink);
    margin-bottom:22px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
  }

  header .mark{
    width:42px;
    height:42px;
    border-radius:50%;
    border:2px solid var(--green-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    color:var(--green-dark);
    flex-shrink:0;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    line-height:1.05;
    margin:0;
    letter-spacing:-0.01em;
  }
  h1 span{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    font-family:'IBM Plex Sans', sans-serif;
    letter-spacing:0.02em;
    margin-top:4px;
  }

  .field-label{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
    display:block;
  }

  .date-row{
    margin-bottom:20px;
  }
  .date-row input[type=date]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    border-radius:8px;
    background:#fff;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
  }

  /* segmented control */
  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#EFE7D2;
    border-radius:10px;
    padding:4px;
    margin-bottom:22px;
    position:relative;
  }
  .tabs button{
    border:none;
    background:transparent;
    padding:12px 8px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14.5px;
    border-radius:7px;
    cursor:pointer;
    color:var(--ink-soft);
    transition:color .15s ease;
    position:relative;
    z-index:1;
  }
  .tabs button.active.in{ color:#fff; }
  .tabs button.active.out{ color:#fff; }
  .tabs .slider{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width:calc(50% - 4px);
    border-radius:7px;
    background:var(--green);
    transition:transform .22s cubic-bezier(.4,0,.2,1), background .22s ease;
    z-index:0;
  }
  .tabs .slider.out{
    transform:translateX(100%);
    background:var(--rust);
  }

  .card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:18px 16px;
    margin-bottom:16px;
    box-shadow:var(--card-shadow);
  }

  .card h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .dot{
    width:8px;height:8px;border-radius:50%;
  }
  .dot.in{ background:var(--green); }
  .dot.out{ background:var(--rust); }

  .amount-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px dashed var(--paper-line);
    padding:10px 0;
    gap:10px;
  }
  .amount-row:first-of-type{ padding-top:0; }
  .amount-row label{
    font-size:14.5px;
    color:var(--ink);
  }
  .amount-input{
    display:flex;
    align-items:center;
    background:#FAF7F0;
    border:1px solid var(--paper-line);
    border-radius:8px;
    padding:0 10px;
    width:130px;
  }
  .amount-input span{
    color:var(--ink-soft);
    font-size:14px;
    margin-right:4px;
  }
  .amount-input input{
    border:none;
    background:transparent;
    outline:none;
    width:100%;
    padding:9px 0;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    text-align:right;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }

  .total-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-top:14px;
    margin-top:4px;
  }
  .total-row .label{
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .total-row .value{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    font-variant-numeric:tabular-nums;
  }
  .total-row .value.in{ color:var(--green-dark); }
  .total-row .value.out{ color:var(--rust-dark); }

  /* cash-out entries */
  .out-entry{
    display:grid;
    grid-template-columns:1fr 96px 30px;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
  }
  .out-entry input[type=text]{
    border:1px solid var(--paper-line);
    border-radius:8px;
    padding:9px 10px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    background:#FAF7F0;
    outline:none;
    color:var(--ink);
    min-width:0;
  }
  .out-entry .amt{
    display:flex;
    align-items:center;
    border:1px solid var(--paper-line);
    border-radius:8px;
    background:#FAF7F0;
    padding:0 8px;
  }
  .out-entry .amt span{ color:var(--ink-soft); font-size:13px; margin-right:2px;}
  .out-entry .amt input{
    border:none;background:transparent;outline:none;
    width:100%;padding:9px 0;
    font-size:14px;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .out-entry .del{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:18px;
    cursor:pointer;
    line-height:1;
    padding:6px;
  }
  .out-entry .del:hover{ color:var(--rust); }

  .add-btn{
    width:100%;
    padding:10px;
    border:1.5px dashed var(--paper-line);
    background:transparent;
    border-radius:8px;
    color:var(--ink-soft);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    margin-top:2px;
  }
  .add-btn:hover{ border-color:var(--rust); color:var(--rust); }

  .note-field{
    margin-bottom:16px;
  }
  .note-field textarea{
    width:100%;
    min-height:60px;
    resize:vertical;
    border:1px solid var(--paper-line);
    border-radius:8px;
    padding:10px 12px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:#fff;
    outline:none;
  }

  .phone-field{
    margin-bottom:22px;
  }
  .phone-field input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    border-radius:8px;
    background:#fff;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
  }
  .phone-field .hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:5px;
  }

  .send-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:var(--green-dark);
    color:#fff;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .send-btn.out-mode{ background:var(--rust-dark); }
  .send-btn:active{ transform:scale(0.99); }
  .send-btn svg{ width:19px; height:19px; flex-shrink:0; }

  .preview{
    margin-top:14px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Jalan Papan Muri Shop<span>Cash Locker report</span></h1>
    </div>
    <div class="mark">786</div>
  </header>

  <div class="date-row">
    <label class="field-label" for="reportDate">Date</label>
    <input type="date" id="reportDate">
  </div>

  <div class="tabs">
    <div class="slider in" id="slider"></div>
    <button type="button" class="active in" id="tabIn">Cash&nbsp;In</button>
    <button type="button" id="tabOut">Cash&nbsp;Out</button>
  </div>

  <!-- CASH IN -->
  <div class="card" id="panelIn">
    <h2><span class="dot in"></span>Cash In</h2>

    <div class="amount-row">
      <label for="cashIn">Cash</label>
      <div class="amount-input">
        <span>$</span>
        <input type="number" inputmode="decimal" id="cashIn" placeholder="0.00" min="0" step="0.01">
      </div>
    </div>
    <div class="amount-row">
      <label for="coinsIn">Coins</label>
      <div class="amount-input">
        <span>$</span>
        <input type="number" inputmode="decimal" id="coinsIn" placeholder="0.00" min="0" step="0.01">
      </div>
    </div>

    <div class="total-row">
      <span class="label">Total Cash In</span>
      <span class="value in" id="totalIn">$0.00</span>
    </div>
  </div>

  <!-- CASH OUT -->
  <div class="card hidden" id="panelOut">
    <h2><span class="dot out"></span>Cash Out</h2>

    <div id="outEntries"></div>

    <button type="button" class="add-btn" id="addEntry">+ Add item</button>

    <div class="total-row">
      <span class="label">Total Cash Out</span>
      <span class="value out" id="totalOut">$0.00</span>
    </div>
  </div>

  <div class="note-field">
    <label class="field-label" for="note">Note (optional)</label>
    <textarea id="note" placeholder="e.g. counted by, shift, till number..."></textarea>
  </div>

  <div class="phone-field">
    <label class="field-label" for="phone">Send to WhatsApp number (optional)</label>
    <input type="text" id="phone" placeholder="e.g. 6825551234 — country code, no + or spaces">
    <div class="hint">Leave blank to pick the contact inside WhatsApp instead.</div>
  </div>

  <button type="button" class="send-btn" id="sendBtn">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4c-4.34 0-7.87 3.5-7.87 7.82 0 1.38.36 2.72 1.05 3.9L4.1 20l4.4-1.15a7.9 7.9 0 0 0 3.55.84h.01c4.34 0 7.87-3.5 7.87-7.82a7.7 7.7 0 0 0-2.33-5.55Z" stroke="#fff" stroke-width="1.5"/>
      <path d="M9.4 8.6c.15-.34.31-.35.45-.35.12 0 .26 0 .37.02.12.02.28-.05.44.34.18.44.6 1.5.65 1.6.06.12.1.26.02.42-.08.16-.12.26-.24.4-.12.14-.25.31-.36.42-.12.12-.25.25-.1.5.15.26.66 1.06 1.42 1.72.98.85 1.8 1.11 2.06 1.24.26.12.4.1.55-.06.16-.16.65-.74.82-1 .17-.24.34-.2.56-.12.24.08 1.5.7 1.75.83.26.12.43.18.5.29.06.12.06.66-.16 1.3-.22.62-1.28 1.2-1.76 1.24-.46.05-.9.23-3.02-.62-2.55-1.03-4.18-3.6-4.31-3.77-.13-.16-1.03-1.36-1.03-2.6 0-1.24.66-1.85.9-2.1Z" fill="#fff"/>
    </svg>
    <span id="sendLabel">Send Cash In report on WhatsApp</span>
  </button>

  <div class="preview" id="preview"></div>

</div>

<script>
  const $ = id => document.getElementById(id);

  // date default = today
  const dateInput = $('reportDate');
  dateInput.valueAsDate = new Date();

  // ---------- Tabs ----------
  let mode = 'in';
  const tabIn = $('tabIn'), tabOut = $('tabOut'), slider = $('slider');
  const panelIn = $('panelIn'), panelOut = $('panelOut');
  const sendBtn = $('sendBtn'), sendLabel = $('sendLabel');

  function setMode(next){
    mode = next;
    const isIn = mode === 'in';
    tabIn.classList.toggle('active', isIn);
    tabOut.classList.toggle('active', !isIn);
    tabIn.classList.toggle('in', true);
    tabOut.classList.toggle('out', true);
    slider.classList.toggle('out', !isIn);
    panelIn.classList.toggle('hidden', !isIn);
    panelOut.classList.toggle('hidden', isIn);
    sendBtn.classList.toggle('out-mode', !isIn);
    sendLabel.textContent = isIn ? 'Send Cash In report on WhatsApp' : 'Send Cash Out report on WhatsApp';
    updatePreview();
  }
  tabIn.addEventListener('click', () => setMode('in'));
  tabOut.addEventListener('click', () => setMode('out'));

  // ---------- Cash In math ----------
  const cashIn = $('cashIn'), coinsIn = $('coinsIn'), totalInEl = $('totalIn');
  function fmt(n){
    if (isNaN(n)) n = 0;
    return '$' + n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function recalcIn(){
    const c = parseFloat(cashIn.value) || 0;
    const co = parseFloat(coinsIn.value) || 0;
    totalInEl.textContent = fmt(c + co);
    updatePreview();
  }
  cashIn.addEventListener('input', recalcIn);
  coinsIn.addEventListener('input', recalcIn);

  // ---------- Cash Out entries ----------
  const outEntries = $('outEntries');
  const totalOutEl = $('totalOut');
  let entryId = 0;

  function addEntry(desc = '', amount = ''){
    entryId++;
    const row = document.createElement('div');
    row.className = 'out-entry';
    row.dataset.id = entryId;
    row.innerHTML = `
      <input type="text" class="desc" placeholder="Description (e.g. supplier payment)" value="${desc}">
      <div class="amt"><span>$</span><input type="number" class="val" inputmode="decimal" placeholder="0.00" min="0" step="0.01" value="${amount}"></div>
      <button type="button" class="del" aria-label="Remove item">&times;</button>
    `;
    outEntries.appendChild(row);
    row.querySelector('.desc').addEventListener('input', updatePreview);
    row.querySelector('.val').addEventListener('input', recalcOut);
    row.querySelector('.del').addEventListener('click', () => {
      row.remove();
      recalcOut();
    });
  }

  function recalcOut(){
    let total = 0;
    outEntries.querySelectorAll('.out-entry').forEach(row => {
      total += parseFloat(row.querySelector('.val').value) || 0;
    });
    totalOutEl.textContent = fmt(total);
    updatePreview();
  }

  $('addEntry').addEventListener('click', () => addEntry());
  addEntry(); // start with one row

  // ---------- Note / phone ----------
  $('note').addEventListener('input', updatePreview);
  dateInput.addEventListener('input', updatePreview);

  // ---------- Report building ----------
  function niceDate(str){
    if(!str) return '';
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString(undefined, {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
  }

  function buildReport(){
    const date = niceDate(dateInput.value);
    const note = $('note').value.trim();
    let lines = [];
    lines.push('*Muri Shop — Cash Locker Report*');
    lines.push(`Date: ${date}`);
    lines.push('');

    if (mode === 'in'){
      const c = parseFloat(cashIn.value) || 0;
      const co = parseFloat(coinsIn.value) || 0;
      lines.push('*Cash-In*');
      lines.push(`Cash: ${fmt(c)}`);
      lines.push(`Coins: ${fmt(co)}`);
      lines.push(`*Total Cash In: ${fmt(c + co)}*`);
    } else {
      lines.push('*Cash-Out*');
      let total = 0;
      let i = 0;
      outEntries.querySelectorAll('.out-entry').forEach(row => {
        const desc = row.querySelector('.desc').value.trim();
        const val = parseFloat(row.querySelector('.val').value) || 0;
        if (desc || val){
          i++;
          total += val;
          lines.push(`${i}. ${desc || '(no description)'} — ${fmt(val)}`);
        }
      });
      if (i === 0) lines.push('(no items entered)');
      lines.push(`*Total Cash Out: ${fmt(total)}*`);
    }

    if (note){
      lines.push('');
      lines.push(`Note: ${note}`);
    }
    return lines.join('\n');
  }

  function updatePreview(){
    $('preview').textContent = mode === 'in'
      ? 'Report will include today\u2019s Cash-In totals.'
      : 'Report will include every Cash-Out item listed above.';
  }

  // ---------- Send ----------
  sendBtn.addEventListener('click', () => {
    const text = buildReport();
    const phoneRaw = $('phone').value.trim().replace(/[^0-9]/g, '');
    const base = phoneRaw ? `https://wa.me/${phoneRaw}` : 'https://wa.me/';
    const url = `${base}?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  });

  recalcIn();
  recalcOut();
  setMode('in');
</script>
</body>
</html>
