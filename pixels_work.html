<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixels Connect - Site Assignment Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0b1f;
    --surface: rgba(255,255,255,0.055);
    --surface2: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.13);
    --accent: #22d3ee;
    --accent2: #a78bfa;
    --text: #f1eeff;
    --text-muted: #a49fc4;
    --green: #34d399;
    --red: #fb7185;
    --grad: linear-gradient(135deg, #22d3ee, #8b5cf6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Manrope', sans-serif; color: var(--text); min-height: 100vh;
    background: radial-gradient(900px 500px at 8% -10%, rgba(139,92,246,0.28), transparent 60%),
                radial-gradient(800px 500px at 100% 0%, rgba(34,211,238,0.16), transparent 60%), var(--bg);
    background-attachment: fixed; }
  header { background: rgba(14,11,31,0.7); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header h1 a { background: inherit; -webkit-background-clip: text; background-clip: text; color: transparent !important; }
  .header-meta { display: flex; align-items: center; gap: 16px; }
  #date-display { font-size: 0.85rem; font-weight: 600; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 7px 16px; }
  .controls-bar { padding: 20px 32px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; max-width: 1600px; margin: 0 auto; }
  .control-group { display: flex; flex-direction: column; gap: 6px; }
  .control-group label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }
  input[type="date"], input[type="text"], textarea, select { background: rgba(255,255,255,0.07); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 9px 13px; font-family: 'Manrope', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; color-scheme: dark; }
  select option { background: #1a1533; color: var(--text); }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,211,238,0.18); }
  textarea { resize: vertical; min-height: 64px; width: 100%; }
  .notes-group { flex: 1; min-width: 260px; }
  .main { padding: 8px 32px 40px; max-width: 1600px; margin: 0 auto; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .section-header h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  .sites-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 32px; }
  .site-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; backdrop-filter: blur(10px); transition: box-shadow 0.25s, border-color 0.25s, transform 0.25s; }
  .site-card:hover { border-color: rgba(167,139,250,0.55); box-shadow: 0 10px 40px rgba(139,92,246,0.22); transform: translateY(-2px); }
  .site-card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: linear-gradient(90deg, rgba(139,92,246,0.28), rgba(34,211,238,0.10)); border-bottom: 1px solid var(--border); gap: 10px; }
  .site-name-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .site-name-input { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.05rem; font-weight: 700; flex: 1; min-width: 0; background: transparent; border: none; color: var(--text); padding: 0; cursor: text; box-shadow: none !important; }
  .site-name-input:focus { border: none; outline: none; color: var(--accent); }
  .site-inline-count { font-family: 'Bricolage Grotesque', sans-serif; font-size: 0.78rem; font-weight: 800; background: var(--grad); color: #0e0b1f; border-radius: 999px; padding: 2px 11px; white-space: nowrap; flex-shrink: 0; line-height: 1.6; }
  .badge { font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .site-card-body { padding: 16px 18px; }
  .employee-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; border-radius: 12px; transition: background 0.15s; }
  .employee-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: rgba(14,11,31,0.55); border: 1px solid var(--border); border-left: 3px solid var(--accent2); border-radius: 10px; cursor: grab; transition: background 0.15s, border-color 0.15s; user-select: none; }
  .employee-item:hover { background: rgba(167,139,250,0.14); border-left-color: var(--accent); }
  .employee-item.dragging { opacity: 0.4; cursor: grabbing; }
  .drag-handle { color: var(--text-muted); font-size: 0.75rem; line-height: 1; flex-shrink: 0; }
  .emp-name { flex: 1; font-size: 0.875rem; font-weight: 600; }
  .remove-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.05rem; line-height: 1; padding: 2px 5px; border-radius: 6px; transition: color 0.15s, background 0.15s; flex-shrink: 0; }
  .remove-btn:hover { color: var(--red); background: rgba(251,113,133,0.15); }
  .add-emp-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .add-emp-row select { flex: 1; font-size: 0.85rem; padding: 8px 10px; }
  .add-btn { background: var(--grad); color: #0e0b1f; border: none; border-radius: 10px; padding: 8px 16px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: filter 0.15s; white-space: nowrap; }
  .add-btn:hover { filter: brightness(1.12); }
  .add-site-card { border: 2px dashed var(--border); border-radius: 20px; display: flex; align-items: center; justify-content: center; min-height: 160px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  .add-site-card:hover { border-color: var(--accent); background: rgba(34,211,238,0.06); }
  .add-site-card span { font-family: 'Bricolage Grotesque', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--text-muted); }
  .add-site-card:hover span { color: var(--accent); }
  .delete-site-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 3px 7px; border-radius: 8px; transition: color 0.15s, background 0.15s; }
  .delete-site-btn:hover { color: var(--red); background: rgba(251,113,133,0.15); }
  .actions { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
  .btn-primary { background: var(--grad); color: #0e0b1f; border: none; border-radius: 12px; padding: 11px 24px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 0.92rem; cursor: pointer; box-shadow: 0 6px 24px rgba(139,92,246,0.35); transition: transform 0.15s, filter 0.2s; display: flex; align-items: center; gap: 8px; }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 11px 22px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 0.92rem; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .summary-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px 24px; margin-top: 28px; }
  .summary-panel h3 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; color: var(--accent); }
  .summary-content { font-family: 'Courier New', monospace; font-size: 0.82rem; color: var(--text); white-space: pre-wrap; line-height: 1.7; display: none; }
  .summary-content.visible { display: block; }
  .unassigned-panel { background: rgba(251,113,133,0.07); border: 1px solid rgba(251,113,133,0.28); border-radius: 20px; padding: 18px 22px; margin-bottom: 24px; }
  .unassigned-panel h3 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .unassigned-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { background: rgba(255,255,255,0.07); border: 1px solid var(--border); border-radius: 999px; padding: 4px 13px; font-size: 0.78rem; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; user-select: none; }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(34,211,238,0.09); }
  .divider { height: 1px; background: var(--border); margin: 10px 0; }
  .shift-row { display: flex; align-items: center; gap: 8px; margin: 8px 0 6px; }
  .shift-input { font-size: 0.8rem; font-weight: 600; background: transparent; border: none; border-bottom: 1px dashed var(--border); border-radius: 0; color: var(--accent2); padding: 2px 4px; width: 150px; cursor: text; box-shadow: none !important; }
  .shift-input:focus { outline: none; color: var(--accent); border-bottom-color: var(--accent); }
  .del-shift-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; padding: 2px 5px; border-radius: 4px; }
  .del-shift-btn:hover { color: var(--red); }
  .add-shift-btn { background: none; border: 1px dashed var(--border); color: var(--text-muted); border-radius: 8px; padding: 4px 11px; font-size: 0.75rem; font-family: inherit; cursor: pointer; margin-top: 6px; transition: all 0.15s; }
  .add-shift-btn:hover { border-color: var(--accent); color: var(--accent); }
  #toast { position: fixed; bottom: 28px; right: 28px; background: var(--grad); color: #0e0b1f; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 0.88rem; padding: 12px 22px; border-radius: 12px; opacity: 0; transform: translateY(12px); transition: all 0.3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; transform: translateY(0); }
  @media (max-width: 600px) { header, .controls-bar, .main { padding-left: 16px; padding-right: 16px; } .sites-grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>⚡ <a href="index.html" style="text-decoration:none;color:inherit;">Pixels Connect </a><span><a href="index.html" style="text-decoration:none;color:inherit;">Site Assign</a></span></h1>
  <div class="header-meta">
    <div id="date-display">Loading...</div>
  </div>
</header>

<div class="controls-bar">
  <div class="control-group">
    <label>Work Date</label>
    <input type="date" id="work-date">
  </div>
  <div class="control-group notes-group">
    <label>Notes</label>
    <textarea id="global-notes" placeholder="Add any general notes, instructions, or reminders..."></textarea>
  </div>
</div>

<div class="main">

  <div class="unassigned-panel" id="unassigned-panel">
    <h3>⬡ Off Employees <span id="unassigned-count" class="badge" style="background:rgba(251,113,133,0.16);color:var(--red);border:1px solid rgba(251,113,133,0.35);">0</span></h3>
    <div class="unassigned-chips" id="unassigned-chips"></div>
  </div>

  <div class="section-header">
    <h2>Site Assignments</h2>
    <div class="actions">
      <button class="btn-secondary" onclick="resetToDefault()">↺ Reset Default</button>
      <button class="btn-primary" onclick="generateSummary()">📋 Generate Summary</button>
    </div>
  </div>

  <div class="sites-grid" id="sites-grid"></div>

  <div class="summary-panel" id="summary-panel">
    <h3>📄 Assignment Summary</h3>
    <pre class="summary-content" id="summary-content"></pre>
  </div>

</div>

<div id="toast">✓ Copied to clipboard!</div>

<script>
const ALL_EMPLOYEES = [
  "MIAH NAYON","SHAKIRUL","MIA HASAN","KHAN MD NURNABI","ALI MOHAMMAD TAHER",
  "MIAH RASHED","ELIAS MD","RANA MOHAMMED SHOHEL","HOSSAIN AMZAD",
  "NAIM ANAMUL HOQ","HASSAN MD JAHID","MD HASAN ALI","MIA MD SOHAG","BASKARAN MANJARI",
  "ISLAM MD NAZRUL","ALOM MD SHAHIN","KYAW ZIN THANT","HOSSAIN MD EMON","KADIR ABDUL",
  "AHMMAD MOHAMMAD AKSAR","HOSSAIN JAHANGIR","HOSSAIN KABIR","RANA JEWEL",
  "HOSSAN YUSUF","BADSHA MD","HOSSAIN MD RIPON",
  "NI SOE OO","MYO MIN LATT","TUN MIN LATT","BO BO ZAW",
  "AUNG WAI PHYO","TUN TUN WIN","SI THU HTUN","HASAN RABBI","HOSSAIN ALIF"
];

const DEFAULT_SITES = [
  { name: "Neythal Rd - MM", shifts: [{ label: "", employees: ["RANA MOHAMMED SHOHEL","HASAN RABBI","HOSSAIN ALIF"] }] },
  { name: "Neythal Rd - Can", shifts: [{ label: "", employees: ["ISLAM MD NAZRUL","HOSSAIN MD RIPON","HOSSAIN AMZAD"] }] },
  { name: "JP - Can", shifts: [
    { label: "", employees: ["NAIM ANAMUL HOQ","ALOM MD SHAHIN","KYAW ZIN THANT","BADSHA MD"] },
    { label: "Night Shift", employees: ["HOSSAIN JAHANGIR","HOSSAIN MD EMON"] }
  ]},
  { name: "Tuas - MM", shifts: [
    { label: "", employees: ["KADIR ABDUL","KHAN MD NURNABI","HASSAN MD JAHID"] },
    { label: "Morning Shift", employees: ["HOSSAIN KABIR"] }
  ]},
  { name: "Kaki Bukit - MM", shifts: [{ label: "", employees: ["ALI MOHAMMAD TAHER","AHMMAD MOHAMMAD AKSAR","BASKARAN MANJARI"] }] },
  { name: "ST Engg", shifts: [{ label: "", employees: [] }] },
  { name: "SN-7", shifts: [{ label: "", employees: ["MIA HASAN","BO BO ZAW","AUNG WAI PHYO"] }] },
  { name: "Army Camp", shifts: [{ label: "", employees: ["ELIAS MD","TUN MIN LATT","MIA MD SOHAG","MYO MIN LATT","MD HASAN ALI","SI THU HTUN"] }] },
  { name: "MOM HQ", shifts: [{ label: "", employees: ["MIAH NAYON","NI SOE OO","TUN TUN WIN"] }] },
  { name: "HCSA", shifts: [{ label: "", employees: ["SHAKIRUL","MIAH RASHED","RANA JEWEL"] }] },
 ];

let sites = [];
let dragSrc = null;

function initDate() {
  const today = new Date();
  today.setDate(today.getDate() + 1);
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  document.getElementById('work-date').value = `${yyyy}-${mm}-${dd}`;
  updateDateDisplay();
}

function updateDateDisplay() {
  const v = document.getElementById('work-date').value;
  if (!v) return;
  const d = new Date(v + 'T00:00:00');
  document.getElementById('date-display').textContent =
    d.toLocaleDateString('en-SG', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

document.getElementById('work-date').addEventListener('change', updateDateDisplay);

function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

function resetToDefault() {
  sites = deepClone(DEFAULT_SITES);
  renderAll();
}

function getAssignedAll() {
  const set = new Set();
  sites.forEach(s => s.shifts.forEach(sh => sh.employees.forEach(e => set.add(e))));
  return set;
}

function renderUnassigned() {
  const assigned = getAssignedAll();
  const unassigned = ALL_EMPLOYEES.filter(e => !assigned.has(e));
  const count = unassigned.length;
  document.getElementById('unassigned-count').textContent = count;
  const panel = document.getElementById('unassigned-panel');
  const chips = document.getElementById('unassigned-chips');
  panel.style.display = count === 0 ? 'none' : 'block';
  chips.innerHTML = '';
  unassigned.forEach(emp => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = emp;
    chip.title = 'Unassigned employee';
    chips.appendChild(chip);
  });
}

function renderAll() {
  renderSites();
  renderUnassigned();
  document.getElementById('summary-content').textContent = '';
  document.getElementById('summary-content').classList.remove('visible');
}

function renderSites() {
  const grid = document.getElementById('sites-grid');
  grid.innerHTML = '';
  sites.forEach((site, sIdx) => grid.appendChild(createSiteCard(site, sIdx)));
  const addCard = document.createElement('div');
  addCard.className = 'add-site-card';
  addCard.innerHTML = '<span>＋ Add New Site</span>';
  addCard.onclick = () => { sites.push({ name: 'New Site', shifts: [{ label: '', employees: [] }] }); renderAll(); };
  grid.appendChild(addCard);
}

function createSiteCard(site, sIdx) {
  const card = document.createElement('div');
  card.className = 'site-card';

  const totalEmp = site.shifts.reduce((a,s) => a + s.employees.length, 0);

  const hdr = document.createElement('div');
  hdr.className = 'site-card-header';

  const nameWrap = document.createElement('div');
  nameWrap.className = 'site-name-wrap';

  const nameInput = document.createElement('input');
  nameInput.className = 'site-name-input';
  nameInput.value = site.name;
  nameInput.title = 'Click to rename site';
  nameInput.onchange = () => { sites[sIdx].name = nameInput.value; renderUnassigned(); };

  const inlineCount = document.createElement('span');
  inlineCount.className = 'site-inline-count';
  inlineCount.textContent = totalEmp;
  inlineCount.title = `${totalEmp} worker${totalEmp !== 1 ? 's' : ''} assigned`;

  nameWrap.appendChild(nameInput);
  nameWrap.appendChild(inlineCount);

  const delBtn = document.createElement('button');
  delBtn.className = 'delete-site-btn';
  delBtn.textContent = '🗑';
  delBtn.title = 'Delete site';
  delBtn.onclick = () => { if (confirm(`Delete site "${site.name}"?`)) { sites.splice(sIdx, 1); renderAll(); } };

  hdr.appendChild(nameWrap);
  hdr.appendChild(delBtn);

  const body = document.createElement('div');
  body.className = 'site-card-body';

  site.shifts.forEach((shift, shIdx) => {
    const shiftRow = document.createElement('div');
    shiftRow.className = 'shift-row';
    const shiftInput = document.createElement('input');
    shiftInput.className = 'shift-input';
    shiftInput.value = shift.label;
    shiftInput.placeholder = 'Shift label (optional)';
    shiftInput.onchange = () => { sites[sIdx].shifts[shIdx].label = shiftInput.value; };

    if (shIdx > 0) {
      const div = document.createElement('div'); div.className = 'divider'; body.appendChild(div);
      const delShift = document.createElement('button');
      delShift.className = 'del-shift-btn'; delShift.textContent = '✕'; delShift.title = 'Remove this shift';
      delShift.onclick = () => { sites[sIdx].shifts.splice(shIdx, 1); renderAll(); };
      shiftRow.appendChild(shiftInput); shiftRow.appendChild(delShift);
    } else { shiftRow.appendChild(shiftInput); }
    body.appendChild(shiftRow);

    const empList = document.createElement('div');
    empList.className = 'employee-list';
    empList.dataset.siteIdx = sIdx;
    empList.dataset.shiftIdx = shIdx;
    shift.employees.forEach((emp, eIdx) => empList.appendChild(createEmpItem(emp, sIdx, shIdx, eIdx)));

    empList.addEventListener('dragover', e => { e.preventDefault(); empList.style.background = 'rgba(34,211,238,0.08)'; });
    empList.addEventListener('dragleave', () => { empList.style.background = ''; });
    empList.addEventListener('drop', e => {
      e.preventDefault(); empList.style.background = '';
      if (!dragSrc) return;
      const { emp, fromSite, fromShift, fromEmp } = dragSrc;
      const toSite = parseInt(empList.dataset.siteIdx);
      const toShift = parseInt(empList.dataset.shiftIdx);
      if (fromSite === toSite && fromShift === toShift) return;
      sites[fromSite].shifts[fromShift].employees.splice(fromEmp, 1);
      sites[toSite].shifts[toShift].employees.push(emp);
      dragSrc = null; renderAll();
    });
    body.appendChild(empList);

    const addRow = document.createElement('div'); addRow.className = 'add-emp-row';
    const sel = document.createElement('select');
    sel.innerHTML = '<option value="">+ Add employee...</option>';
    const assignedAnywhere = getAssignedAll();
    const available = ALL_EMPLOYEES.filter(emp => !assignedAnywhere.has(emp));
    if (available.length === 0) {
      const opt = document.createElement('option'); opt.disabled = true; opt.textContent = '— All employees assigned —'; sel.appendChild(opt);
    } else {
      available.forEach(emp => { const opt = document.createElement('option'); opt.value = emp; opt.textContent = emp; sel.appendChild(opt); });
    }
    const addBtn = document.createElement('button'); addBtn.className = 'add-btn'; addBtn.textContent = 'Add';
    addBtn.onclick = () => {
      const val = sel.value; if (!val) return;
      sites.forEach(s => s.shifts.forEach(sh => { const i = sh.employees.indexOf(val); if (i !== -1) sh.employees.splice(i, 1); }));
      sites[sIdx].shifts[shIdx].employees.push(val); renderAll();
    };
    addRow.appendChild(sel); addRow.appendChild(addBtn); body.appendChild(addRow);
  });

  const addShiftBtn = document.createElement('button'); addShiftBtn.className = 'add-shift-btn'; addShiftBtn.textContent = '+ Add Shift Group';
  addShiftBtn.onclick = () => { sites[sIdx].shifts.push({ label: '', employees: [] }); renderAll(); };
  body.appendChild(addShiftBtn);

  card.appendChild(hdr); card.appendChild(body);
  return card;
}

function createEmpItem(emp, sIdx, shIdx, eIdx) {
  const item = document.createElement('div');
  item.className = 'employee-item'; item.draggable = true;
  item.addEventListener('dragstart', () => { item.classList.add('dragging'); dragSrc = { emp, fromSite: sIdx, fromShift: shIdx, fromEmp: eIdx }; });
  item.addEventListener('dragend', () => { item.classList.remove('dragging'); });
  const handle = document.createElement('span'); handle.className = 'drag-handle'; handle.textContent = '⠿';
  const name = document.createElement('span'); name.className = 'emp-name'; name.textContent = emp;
  const rmBtn = document.createElement('button'); rmBtn.className = 'remove-btn'; rmBtn.textContent = '×'; rmBtn.title = 'Remove from this site';
  rmBtn.onclick = () => { sites[sIdx].shifts[shIdx].employees.splice(eIdx, 1); renderAll(); };
  item.appendChild(handle); item.appendChild(name); item.appendChild(rmBtn);
  return item;
}

function generateSummary() {
  const date = document.getElementById('work-date').value;
  const notes = document.getElementById('global-notes').value.trim();
  const d = date ? new Date(date + 'T00:00:00').toLocaleDateString('en-SG', { weekday:'long', year:'numeric', month:'long', day:'numeric' }) : 'Date not set';
  let txt = `*WORK SCHEDULE*\n${'─'.repeat(20)}\nSchedule Date: _${d}_\n`;
  if (notes) txt += `Notes: _${notes}_\n`;
  txt += `${'─'.repeat(20)}\n\n`;
  sites.forEach(site => {
    const total = site.shifts.reduce((a,s) => a + s.employees.length, 0);
    txt += `📍 *${site.name.toUpperCase()}* _(${total})_\n`;
    site.shifts.forEach(sh => { if (sh.label) txt += `  [${sh.label}]\n`; sh.employees.forEach(emp => txt += `  • ${emp}\n`); });
    txt += '\n';
  });
  const assigned = getAssignedAll();
  const unassigned = ALL_EMPLOYEES.filter(e => !assigned.has(e));
  if (unassigned.length) { txt += `⚠️  OFF (${unassigned.length})\n`; unassigned.forEach(e => txt += `  • ${e}\n`); }
  const el = document.getElementById('summary-content');
  el.textContent = txt; el.classList.add('visible');
  el.scrollIntoView({ behavior:'smooth', block:'start' });
  navigator.clipboard.writeText(txt).then(() => showToast()).catch(() => {});
}

function showToast() {
  const t = document.getElementById('toast'); t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

initDate();
resetToDefault();
</script>
