<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixels Connect - Site Assignment Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#e4ebe6; --card:#fbfbf8; --ink:#14231f; --muted:#5f6d68; --line:#cfd5cd; --signal:#f2b134; --red:#b4432f; --pine:#1f5c4b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Public Sans',sans-serif; color:var(--ink); min-height:100vh;
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(242,177,52,0.22) 0, transparent 38%),
      radial-gradient(circle at 88% 82%, rgba(31,92,75,0.20) 0, transparent 42%),
      linear-gradient(rgba(31,92,75,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31,92,75,0.07) 1px, transparent 1px),
      radial-gradient(rgba(20,35,31,0.14) 1.2px, transparent 1.4px);
    background-size:auto, auto, 32px 32px, 32px 32px, 32px 32px;
    background-position:0 0, 0 0, 0 0, 0 0, 16px 16px;
    background-attachment:fixed;
  }
  header { background:var(--ink); color:#f3f5ef; padding:14px 32px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:100; border-bottom:4px solid var(--signal); }
  header h1 { font-family:'Barlow Condensed',sans-serif; font-size:1.9rem; font-weight:700; letter-spacing:0.01em; }
  header h1 a { color:inherit; text-decoration:none; }
  header h1 small { font-size:1.1rem; font-weight:600; color:var(--signal); margin-left:10px; }
  .header-meta { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  #date-display { font-family:'Barlow Condensed',sans-serif; font-size:1.15rem; font-weight:600; color:var(--ink); background:var(--signal); padding:4px 14px; border-radius:4px; }
  input[type="date"] { background:#22352f; color:#f3f5ef; border:1px solid #3d524b; border-radius:4px; padding:6px 10px; font-family:inherit; font-size:0.85rem; color-scheme:dark; }
  input[type="text"], textarea, select { background:#fff; border:1px solid var(--line); color:var(--ink); border-radius:4px; padding:8px 11px; font-family:inherit; font-size:0.9rem; outline:none; }
  input:focus, textarea:focus, select:focus { border-color:var(--pine); box-shadow:0 0 0 3px rgba(31,92,75,0.2); }
  textarea { resize:vertical; min-height:72px; width:100%; }
  .main { padding:24px 32px 48px; max-width:1600px; margin:0 auto; }
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px; }
  .section-header h2 { font-family:'Barlow Condensed',sans-serif; font-size:1.7rem; font-weight:700; }
  .sites-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:18px; margin-bottom:32px; align-items:start; }
  .site-card { --c:#1f7a8c; background:var(--card); border:1px solid var(--line); border-top:8px solid var(--c); border-radius:4px 4px 14px 4px; box-shadow:0 2px 8px rgba(20,35,31,0.08); }
  .site-card-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; gap:10px; }
  .site-name-wrap { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
  .site-inline-count { font-family:'Barlow Condensed',sans-serif; font-size:2.4rem; font-weight:700; line-height:1; color:var(--c); order:-1; min-width:30px; text-align:center; }
  .site-name-input { font-family:'Barlow Condensed',sans-serif; font-size:1.35rem; font-weight:700; flex:1; min-width:0; background:transparent; border:none; border-bottom:1px dashed transparent; border-radius:0; color:var(--ink); padding:0; box-shadow:none !important; }
  .site-name-input:hover, .site-name-input:focus { border-bottom-color:var(--c); }
  .site-card-body { padding:6px 16px 16px; }
  .employee-list { display:flex; flex-direction:column; gap:5px; margin-bottom:8px; min-height:8px; border-radius:6px; }
  .employee-item { display:flex; align-items:center; gap:10px; padding:7px 10px; background:#fff; border:1px solid var(--line); border-left:5px solid var(--c); border-radius:3px 10px 10px 3px; cursor:grab; user-select:none; }
  .employee-item:hover { background:#f3f6f1; }
  .employee-item.dragging { opacity:0.4; cursor:grabbing; }
  .drag-handle { color:var(--muted); font-size:0.75rem; }
  .emp-name { flex:1; font-size:0.86rem; font-weight:600; }
  .remove-btn, .delete-site-btn, .del-shift-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.05rem; line-height:1; padding:3px 6px; border-radius:4px; }
  .remove-btn:hover, .delete-site-btn:hover, .del-shift-btn:hover { color:var(--red); background:rgba(180,67,47,0.1); }
  .add-emp-row { display:flex; gap:8px; margin-top:8px; }
  .add-emp-row select { flex:1; font-size:0.84rem; padding:7px 9px; min-width:0; }
  .add-btn { background:var(--ink); color:#fff; border:none; border-radius:4px; padding:7px 16px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1rem; cursor:pointer; }
  .add-btn:hover { background:var(--c); }
  .add-site-card { border:2px dashed var(--muted); border-radius:4px 4px 14px 4px; display:flex; align-items:center; justify-content:center; min-height:150px; cursor:pointer; }
  .add-site-card:hover { border-color:var(--pine); background:rgba(31,92,75,0.06); }
  .add-site-card span { font-family:'Barlow Condensed',sans-serif; font-size:1.2rem; font-weight:700; color:var(--muted); }
  .btn-primary { background:var(--signal); color:var(--ink); border:2px solid var(--ink); border-radius:4px; padding:9px 22px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.1rem; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
  .btn-primary:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
  .btn-primary:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .btn-secondary { background:rgba(251,251,248,0.7); color:var(--ink); border:2px solid var(--ink); border-radius:4px; padding:7px 18px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.05rem; cursor:pointer; }
  .btn-secondary:hover { background:var(--ink); color:#fff; }
  button:focus-visible { outline:3px solid var(--pine); outline-offset:2px; }
  .unassigned-panel { background:repeating-linear-gradient(-45deg,#f6e3df,#f6e3df 10px,#f9ece9 10px,#f9ece9 20px); border:1px solid #e2b8b0; border-radius:4px; padding:14px 18px; margin-bottom:24px; }
  .unassigned-panel h3 { font-family:'Barlow Condensed',sans-serif; font-size:1.2rem; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:10px; color:var(--red); }
  .badge { font-size:0.8rem; font-weight:700; padding:1px 10px; border-radius:999px; background:var(--red); color:#fff; }
  .unassigned-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#fff; border:1px solid #e2b8b0; border-radius:4px; padding:3px 11px; font-size:0.78rem; font-weight:500; }
  .divider { height:1px; background:var(--line); margin:10px 0; }
  .shift-row { display:flex; align-items:center; gap:8px; margin:8px 0 6px; }
  .shift-input { font-size:0.8rem; font-weight:600; background:transparent; border:none; border-bottom:1px dashed var(--muted); border-radius:0; color:var(--c); padding:2px 4px; width:150px; box-shadow:none !important; }
  .add-shift-btn { background:none; border:1px dashed var(--muted); color:var(--muted); border-radius:4px; padding:4px 11px; font-size:0.75rem; font-family:inherit; cursor:pointer; margin-top:6px; }
  .add-shift-btn:hover { border-color:var(--c); color:var(--c); }
  .report-panel { background:var(--card); border:1px solid var(--line); border-left:8px solid var(--ink); border-radius:4px; padding:20px 24px; box-shadow:0 2px 8px rgba(20,35,31,0.08); }
  .report-panel h2 { font-family:'Barlow Condensed',sans-serif; font-size:1.7rem; font-weight:700; margin-bottom:14px; }
  .report-panel label { display:block; font-size:0.82rem; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .report-actions { display:flex; gap:12px; justify-content:flex-end; margin:14px 0; flex-wrap:wrap; }
  .summary-content { font-family:'Courier New',monospace; font-size:0.84rem; white-space:pre-wrap; line-height:1.7; background:#fff; border:1px solid var(--line); border-radius:4px; padding:14px 16px; display:none; }
  .summary-content.visible { display:block; }
  #toast { position:fixed; bottom:24px; right:24px; background:var(--ink); color:var(--signal); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.05rem; padding:10px 20px; border-radius:4px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:999; }
  #toast.show { opacity:1; }
  @media (max-width:600px) { header, .main { padding-left:16px; padding-right:16px; } .sites-grid { grid-template-columns:1fr; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header>
  <h1><a href="index.html">Pixels Connect<small>Site Assign</small></a></h1>
  <div class="header-meta">
    <div id="date-display">Loading...</div>
    <input type="date" id="work-date" aria-label="Work date">
  </div>
</header>

<div class="main">

  <div class="unassigned-panel" id="unassigned-panel">
    <h3>Off employees <span id="unassigned-count" class="badge">0</span></h3>
    <div class="unassigned-chips" id="unassigned-chips"></div>
  </div>

  <div class="section-header">
    <h2>Site assignments</h2>
    <button class="btn-secondary" onclick="resetToDefault()">Reset default</button>
  </div>

  <div class="sites-grid" id="sites-grid"></div>

  <div class="report-panel" id="summary-panel">
    <label for="global-notes">Notes (added at the end of the report text)</label>
    <textarea id="global-notes" placeholder="Add any general notes, instructions, or reminders..."></textarea>
    <div class="report-actions">
      <button class="btn-primary" onclick="generateSummary()">Generate and copy report</button>
    </div>
    <pre class="summary-content" id="summary-content"></pre>
  </div>

</div>

<div id="toast">Copied to clipboard</div>

<script>
const ALL_EMPLOYEES = [
  "MIAH NAYON","SHAKIRUL","MIA HASAN","KHAN MD NURNABI","ALI MOHAMMAD TAHER",
  "MIAH RASHED","ELIAS MD","RANA MOHAMMED SHOHEL","HOSSAIN AMZAD",
  "NAIM ANAMUL HOQ","HASSAN MD JAHID","MD HASAN ALI","MIA MD SOHAG","BASKARAN MANJARI",
  "ISLAM MD NAZRUL","ALOM MD SHAHIN","KYAW ZIN THANT","HOSSAIN MD EMON","KADIR ABDUL",
  "AHMMAD MOHAMMAD AKSAR","HOSSAIN JAHANGIR","HOSSAIN KABIR","RANA JEWEL",
  "HOSSAN YUSUF","BADSHA MD","HOSSAIN MD RIPON",
  "NI SOE OO","MYO MIN LATT","TUN MIN LATT","BO BO ZAW",
  "AUNG WAI PHYO","TUN TUN WIN","SI THU HTUN","HASAN RABBI","HOSSAIN ALIF","HOSSAN TANVIR","ABEDIN ZOYNAL"
];

const DEFAULT_SITES = [
  { name: "Neythal Rd - MM", shifts: [{ label: "", employees: ["HOSSAN TANVIR","RANA MOHAMMED SHOHEL","HASAN RABBI"] }] },
  { name: "Neythal Rd - Can", shifts: [{ label: "", employees: ["ISLAM MD NAZRUL","HOSSAIN MD RIPON","HOSSAIN AMZAD","HOSSAIN ALIF"] }] },
  { name: "JP - Can", shifts: [
    { label: "", employees: ["NAIM ANAMUL HOQ","ALOM MD SHAHIN","KYAW ZIN THANT","BADSHA MD","ABEDIN ZOYNAL"] },
    { label: "Night Shift", employees: ["HOSSAIN JAHANGIR","HOSSAIN MD EMON"] }
  ]},
  { name: "Tuas - MM", shifts: [
    { label: "", employees: ["KADIR ABDUL","KHAN MD NURNABI","HASSAN MD JAHID"] },
    { label: "Morning Shift", employees: ["HOSSAIN KABIR"] }
  ]},
  { name: "Kaki Bukit - MM", shifts: [{ label: "", employees: ["ALI MOHAMMAD TAHER","AHMMAD MOHAMMAD AKSAR","BASKARAN MANJARI"] }] },
  { name: "ST Engg", shifts: [{ label: "", employees: ["MIAH RASHED","ELIAS MD","MIA MD SOHAG","TUN TUN WIN"] }] },
  { name: "SN-7", shifts: [{ label: "", employees: ["MIA HASAN","AUNG WAI PHYO","NI SOE OO","MD HASAN ALI"] }] },
  { name: "MOM HQ", shifts: [{ label: "", employees: ["MIAH NAYON","MYO MIN LATT"] }] },
  { name: "HCSA", shifts: [{ label: "", employees: ["SHAKIRUL","RANA JEWEL"] }] },
  { name: "Ngee Ann Poly", shifts: [{ label: "", employees: ["TUN MIN LATT","BO BO ZAW","SI THU HTUN"] }] },
];

const SITE_COLORS = ["#1f7a8c","#7b3f6e","#b7791f","#2f5d9e","#b4432f","#3f7d4e"];
let sites = [];
let dragSrc = null;

function initDate() {
  const today = new Date();
  today.setDate(today.getDate() + 1);
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  document.getElementById('work-date').value = `${yyyy}-${mm}-${dd}`;
  updateDateDisplay();
}

function updateDateDisplay() {
  const v = document.getElementById('work-date').value;
  if (!v) return;
  const d = new Date(v + 'T00:00:00');
  document.getElementById('date-display').textContent =
    d.toLocaleDateString('en-SG', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

document.getElementById('work-date').addEventListener('change', updateDateDisplay);

function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

function resetToDefault() {
  sites = deepClone(DEFAULT_SITES);
  renderAll();
}

function getAssignedAll() {
  const set = new Set();
  sites.forEach(s => s.shifts.forEach(sh => sh.employees.forEach(e => set.add(e))));
  return set;
}

function renderUnassigned() {
  const assigned = getAssignedAll();
  const unassigned = ALL_EMPLOYEES.filter(e => !assigned.has(e));
  const count = unassigned.length;
  document.getElementById('unassigned-count').textContent = count;
  document.getElementById('unassigned-panel').style.display = count === 0 ? 'none' : 'block';
  const chips = document.getElementById('unassigned-chips');
  chips.innerHTML = '';
  unassigned.forEach(emp => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = emp;
    chips.appendChild(chip);
  });
}

function renderAll() {
  renderSites();
  renderUnassigned();
  const el = document.getElementById('summary-content');
  el.textContent = '';
  el.classList.remove('visible');
}

function renderSites() {
  const grid = document.getElementById('sites-grid');
  grid.innerHTML = '';
  sites.forEach((site, sIdx) => grid.appendChild(createSiteCard(site, sIdx)));
  const addCard = document.createElement('div');
  addCard.className = 'add-site-card';
  addCard.innerHTML = '<span>+ Add new site</span>';
  addCard.onclick = () => { sites.push({ name: 'New Site', shifts: [{ label: '', employees: [] }] }); renderAll(); };
  grid.appendChild(addCard);
}

function createSiteCard(site, sIdx) {
  const card = document.createElement('div');
  card.className = 'site-card';
  card.style.setProperty('--c', SITE_COLORS[sIdx % SITE_COLORS.length]);

  const totalEmp = site.shifts.reduce((a,s) => a + s.employees.length, 0);

  const hdr = document.createElement('div');
  hdr.className = 'site-card-header';
  const nameWrap = document.createElement('div');
  nameWrap.className = 'site-name-wrap';

  const nameInput = document.createElement('input');
  nameInput.className = 'site-name-input';
  nameInput.value = site.name;
  nameInput.title = 'Click to rename site';
  nameInput.onchange = () => { sites[sIdx].name = nameInput.value; };

  const inlineCount = document.createElement('span');
  inlineCount.className = 'site-inline-count';
  inlineCount.textContent = totalEmp;
  inlineCount.title = `${totalEmp} worker${totalEmp !== 1 ? 's' : ''} assigned`;

  nameWrap.appendChild(nameInput);
  nameWrap.appendChild(inlineCount);

  const delBtn = document.createElement('button');
  delBtn.className = 'delete-site-btn';
  delBtn.textContent = '🗑';
  delBtn.title = 'Delete site';
  delBtn.onclick = () => { if (confirm(`Delete site "${site.name}"?`)) { sites.splice(sIdx, 1); renderAll(); } };

  hdr.appendChild(nameWrap);
  hdr.appendChild(delBtn);

  const body = document.createElement('div');
  body.className = 'site-card-body';

  site.shifts.forEach((shift, shIdx) => {
    const shiftRow = document.createElement('div');
    shiftRow.className = 'shift-row';
    const shiftInput = document.createElement('input');
    shiftInput.className = 'shift-input';
    shiftInput.value = shift.label;
    shiftInput.placeholder = 'Shift label (optional)';
    shiftInput.onchange = () => { sites[sIdx].shifts[shIdx].label = shiftInput.value; };

    if (shIdx > 0) {
      const div = document.createElement('div'); div.className = 'divider'; body.appendChild(div);
      const delShift = document.createElement('button');
      delShift.className = 'del-shift-btn'; delShift.textContent = '✕'; delShift.title = 'Remove this shift';
      delShift.onclick = () => { sites[sIdx].shifts.splice(shIdx, 1); renderAll(); };
      shiftRow.appendChild(shiftInput); shiftRow.appendChild(delShift);
    } else { shiftRow.appendChild(shiftInput); }
    body.appendChild(shiftRow);

    const empList = document.createElement('div');
    empList.className = 'employee-list';
    empList.dataset.siteIdx = sIdx;
    empList.dataset.shiftIdx = shIdx;
    shift.employees.forEach((emp, eIdx) => empList.appendChild(createEmpItem(emp, sIdx, shIdx, eIdx)));

    empList.addEventListener('dragover', e => { e.preventDefault(); empList.style.background = 'rgba(31,92,75,0.1)'; });
    empList.addEventListener('dragleave', () => { empList.style.background = ''; });
    empList.addEventListener('drop', e => {
      e.preventDefault(); empList.style.background = '';
      if (!dragSrc) return;
      const { emp, fromSite, fromShift, fromEmp } = dragSrc;
      const toSite = parseInt(empList.dataset.siteIdx);
      const toShift = parseInt(empList.dataset.shiftIdx);
      if (fromSite === toSite && fromShift === toShift) return;
      sites[fromSite].shifts[fromShift].employees.splice(fromEmp, 1);
      sites[toSite].shifts[toShift].employees.push(emp);
      dragSrc = null; renderAll();
    });
    body.appendChild(empList);

    const addRow = document.createElement('div'); addRow.className = 'add-emp-row';
    const sel = document.createElement('select');
    sel.innerHTML = '<option value="">+ Add employee...</option>';
    const assignedAnywhere = getAssignedAll();
    const available = ALL_EMPLOYEES.filter(emp => !assignedAnywhere.has(emp));
    if (available.length === 0) {
      const opt = document.createElement('option'); opt.disabled = true; opt.textContent = '— All employees assigned —'; sel.appendChild(opt);
    } else {
      available.forEach(emp => { const opt = document.createElement('option'); opt.value = emp; opt.textContent = emp; sel.appendChild(opt); });
    }
    const addBtn = document.createElement('button'); addBtn.className = 'add-btn'; addBtn.textContent = 'Add';
    addBtn.onclick = () => {
      const val = sel.value; if (!val) return;
      sites.forEach(s => s.shifts.forEach(sh => { const i = sh.employees.indexOf(val); if (i !== -1) sh.employees.splice(i, 1); }));
      sites[sIdx].shifts[shIdx].employees.push(val); renderAll();
    };
    addRow.appendChild(sel); addRow.appendChild(addBtn); body.appendChild(addRow);
  });

  const addShiftBtn = document.createElement('button'); addShiftBtn.className = 'add-shift-btn'; addShiftBtn.textContent = '+ Add shift group';
  addShiftBtn.onclick = () => { sites[sIdx].shifts.push({ label: '', employees: [] }); renderAll(); };
  body.appendChild(addShiftBtn);

  card.appendChild(hdr); card.appendChild(body);
  return card;
}

function createEmpItem(emp, sIdx, shIdx, eIdx) {
  const item = document.createElement('div');
  item.className = 'employee-item'; item.draggable = true;
  item.addEventListener('dragstart', () => { item.classList.add('dragging'); dragSrc = { emp, fromSite: sIdx, fromShift: shIdx, fromEmp: eIdx }; });
  item.addEventListener('dragend', () => { item.classList.remove('dragging'); });
  const handle = document.createElement('span'); handle.className = 'drag-handle'; handle.textContent = '⠿';
  const name = document.createElement('span'); name.className = 'emp-name'; name.textContent = emp;
  const rmBtn = document.createElement('button'); rmBtn.className = 'remove-btn'; rmBtn.textContent = '×'; rmBtn.title = 'Remove from this site';
  rmBtn.onclick = () => { sites[sIdx].shifts[shIdx].employees.splice(eIdx, 1); renderAll(); };
  item.appendChild(handle); item.appendChild(name); item.appendChild(rmBtn);
  return item;
}

function generateSummary() {
  const date = document.getElementById('work-date').value;
  const notes = document.getElementById('global-notes').value.trim();
  const d = date ? new Date(date + 'T00:00:00').toLocaleDateString('en-SG', { weekday:'long', year:'numeric', month:'long', day:'numeric' }) : 'Date not set';
  let txt = `*WORK SCHEDULE*\n${'─'.repeat(20)}\nSchedule Date: _${d}_\n${'─'.repeat(20)}\n\n`;
  sites.forEach(site => {
    const total = site.shifts.reduce((a,s) => a + s.employees.length, 0);
    txt += `📍 *${site.name.toUpperCase()}* _(${total})_\n`;
    site.shifts.forEach(sh => { if (sh.label) txt += `  [${sh.label}]\n`; sh.employees.forEach(emp => txt += `  • ${emp}\n`); });
    txt += '\n';
  });
  const assigned = getAssignedAll();
  const unassigned = ALL_EMPLOYEES.filter(e => !assigned.has(e));
  if (unassigned.length) { txt += `⚠️  OFF (${unassigned.length})\n`; unassigned.forEach(e => txt += `  • ${e}\n`); txt += '\n'; }
  if (notes) txt += `${'─'.repeat(20)}\n*NOTES*\n_${notes}_\n`;
  txt = txt.trimEnd();
  const el = document.getElementById('summary-content');
  el.textContent = txt; el.classList.add('visible');
  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  navigator.clipboard.writeText(txt).then(showToast).catch(() => {});
}

function showToast() {
  const t = document.getElementById('toast'); t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

initDate();
resetToDefault();
</script>
</body>
</html>
