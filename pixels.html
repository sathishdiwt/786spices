<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b1020">
<title>Pixels Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@layer base, layout, components, utilities;

@layer base {
  :root {
    color-scheme: light dark;
    --bg: light-dark(#eef1f8, #0b1020);
    --surface: light-dark(rgb(255 255 255 / .78), rgb(24 31 56 / .62));
    --surface-solid: light-dark(#ffffff, #151c36);
    --border: light-dark(rgb(15 23 42 / .09), rgb(255 255 255 / .09));
    --text: light-dark(#0f172a, #e8ecf8);
    --muted: light-dark(#5b6478, #8d97b5);
    --accent: #ff6a33;
    --shadow: light-dark(0 10px 30px rgb(30 41 90 / .10), 0 10px 30px rgb(0 0 0 / .35));
    --radius: 22px;
    --nav-h: 68px;
    --side-w: 240px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100dvh;
    line-height: 1.45;
    background-image:
      radial-gradient(60rem 30rem at 85% -10%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 60%),
      radial-gradient(50rem 28rem at -10% 10%, color-mix(in oklab, #3b6cff 22%, transparent), transparent 60%);
    background-attachment: fixed;
  }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; text-wrap: balance; }
}

@layer layout {
  .app { display: grid; min-height: 100dvh; }
  main {
    padding: 20px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom));
    max-width: 1100px; width: 100%; margin-inline: auto;
  }
  .sidebar { display: none; }
  .bottom-nav {
    position: fixed; inset: auto 10px calc(10px + env(safe-area-inset-bottom)) 10px;
    height: var(--nav-h); z-index: 50;
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 24px; box-shadow: var(--shadow);
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  }
  @media (min-width: 900px) {
    .app { grid-template-columns: var(--side-w) 1fr; }
    .sidebar {
      display: flex; flex-direction: column; gap: 6px;
      position: sticky; top: 0; height: 100dvh; padding: 22px 16px;
      background: var(--surface); border-right: 1px solid var(--border);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .bottom-nav { display: none; }
    main { padding: 32px 36px 48px; }
  }
}

@layer components {
  /* brand */
  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #ffb347); color: #fff; font-weight: 700;
    font-family: 'Space Grotesk'; font-size: 18px; box-shadow: 0 6px 16px rgb(255 106 51 / .4);
  }
  .brand b { font-family: 'Space Grotesk'; font-size: 17px; display: block; line-height: 1.1; }
  .brand small { color: var(--muted); font-size: 11px; }

  .side-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }
  .side-link {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px;
    font-weight: 500; font-size: 14px; color: var(--muted);
    transition: background .2s, color .2s, transform .2s;
  }
  .side-link:hover { background: color-mix(in oklab, var(--accent) 10%, transparent); color: var(--text); }
  .side-link.active { background: color-mix(in oklab, var(--accent) 16%, transparent); color: var(--accent); }
  .side-link .ic { font-size: 18px; width: 24px; text-align: center; }

  .nav-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border-radius: 18px; color: var(--muted); font-size: 10px; font-weight: 500; min-width: 0;
    touch-action: manipulation; transition: background .2s, color .2s, transform .15s;
  }
  .nav-btn .ic { font-size: 20px; line-height: 1; }
  .nav-btn .lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-btn:active { transform: scale(.92); }
  .nav-btn.active { color: var(--accent); background: color-mix(in oklab, var(--accent) 16%, transparent); }

  /* header */
  .top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
  .hello small { color: var(--muted); font-size: 13px; }
  .hello h1 { font-size: clamp(26px, 6vw, 38px); line-height: 1.05; margin-top: 2px; }
  .clock {
    text-align: right; padding: 10px 16px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .clock .t { font-family: 'Space Grotesk'; font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
  .clock .d { font-size: 12px; color: var(--muted); }
  .clock .t::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgb(34 197 94 / .2); vertical-align: middle; }

  /* search */
  .search {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; margin-bottom: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 20%, transparent); }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 15px; min-width: 0; }
  .search input::placeholder { color: var(--muted); }

  /* sections */
  .group { margin-top: 28px; }
  .group h2 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .group h2::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .group:not(:has(.card:not([hidden]))) { display: none; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }

  .card {
    --c: var(--accent);
    container-type: inline-size;
    position: relative; display: flex; gap: 16px; align-items: flex-start; padding: 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
    animation: rise .5s both; animation-delay: calc(var(--i, 0) * 50ms);
  }
  .card::before {
    content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c);
  }
  .card::after {
    content: ''; position: absolute; width: 140px; height: 140px; right: -40px; top: -50px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in oklab, var(--c) 30%, transparent), transparent 70%);
    pointer-events: none; transition: transform .4s;
  }
  .card[hidden] { display: none; }
  .card:hover { transform: translateY(-4px); border-color: color-mix(in oklab, var(--c) 55%, var(--border)); }
  .card:hover::after { transform: scale(1.4); }
  .card:active { transform: scale(.98); }
  .card:focus-visible, .side-link:focus-visible, .nav-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .badge {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px;
    background: color-mix(in oklab, var(--c) 18%, transparent);
  }
  .info { flex: 1; min-width: 0; }
  .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .meta .tag { color: var(--c); filter: brightness(1.1); }
  .meta .wo { color: var(--muted); font-weight: 500; }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-weight: 500; }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  .info h3 { font-size: 18px; line-height: 1.15; margin-bottom: 4px; }
  .info p { font-size: 13px; color: var(--muted); }
  .go { margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--c); display: inline-flex; gap: 6px; align-items: center; }
  .go span { transition: transform .2s; }
  .card:hover .go span { transform: translateX(5px); }

  /* tool tiles */
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
  .tile {
    display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
    transition: transform .2s, border-color .2s;
  }
  .tile:hover { transform: translateY(-3px); border-color: var(--accent); }
  .tile .ic { font-size: 24px; }
  .tile b { font-family: 'Space Grotesk'; font-size: 15px; }
  .tile small { color: var(--muted); font-size: 12px; margin-top: -8px; }
  .tile[hidden] { display: none; }

  .empty { display: none; text-align: center; color: var(--muted); padding: 40px 0; }
  body:not(:has(.card:not([hidden]), .tile:not([hidden]))) .empty { display: block; }

  footer { margin-top: 36px; text-align: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  @keyframes rise { from { opacity: 0; translate: 0 14px; } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgb(34 197 94 / 0); } 0% { box-shadow: 0 0 0 0 rgb(34 197 94 / .5); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

  @media (max-width: 380px) {
    .nav-btn { font-size: 9px; } .nav-btn .ic { font-size: 18px; }
    .badge { width: 44px; height: 44px; font-size: 22px; }
  }
}
</style>
</head>
<body>

<div class="app">

  <!-- Desktop sidebar -->
  <aside class="sidebar" aria-label="Main menu">
    <div class="brand"><div class="logo">P</div><div><b>Pixels Ops</b><small>Operations Portal</small></div></div>
    <div class="side-label">Menu</div>
    <div id="sideMenu"></div>
  </aside>

  <main>
    <header class="top">
      <div class="hello">
        <small id="greet">Welcome</small>
        <h1>Operations Hub</h1>
      </div>
      <div class="clock"><div class="t" id="clockTime">--:--</div><div class="d" id="clockDate">Loading</div></div>
    </header>

    <label class="search">
      <span aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="Search forms, reports, tools…" autocomplete="off" aria-label="Search">
    </label>

    <div id="content"></div>
    <p class="empty">No matching items found.</p>

    <footer>Pixels Connect • Operations Portal</footer>
  </main>
</div>

<!-- Mobile bottom nav -->
<nav class="bottom-nav" id="bottomNav" aria-label="Main menu"></nav>

<script>
const BASE = 'https://786spices.vercel.app/';

/* Bottom / side menu (all original links) */
const MENU = [
  { ic:'📊', lbl:'Dashboard',  href: BASE+'pixels.html', active:true },
  { ic:'🧰', lbl:'CCV',        href:'https://forms.office.com/r/smX5FFF9Vs' },
  { ic:'👥', lbl:'Staffs',     href: BASE+'pixels-employee-management.html' },
  { ic:'⏱️', lbl:'ATTNS',      href: BASE+'attns.html' },
  { ic:'⌛', lbl:'OT Workers', href: BASE+'ot-tracker.html' },
  { ic:'👷🏻‍♂️', lbl:'Manpower',  href: BASE+'sitemanpowerqty.html' },
];

/* Work orders, grouped */
const GROUPS = [
  { title:'Site Reporting', items:[
    { wo:'01', tag:'Manpower',   c:'#ff6a33', ic:'👥', t:'Workforce Updates', d:'For Maincon Group Manpower Update', href: BASE+'pixels_manpower_update.html' },
    { wo:'02', tag:'Operations', c:'#3b82f6', ic:'🛠️', t:'Site Work Activity', d:'Daily Site Activity log', href: BASE+'site_work_activity_report.html' },
    { wo:'03', tag:'Analytics',  c:'#10b981', ic:'📊', t:'Site Reports', d:'Daily Site Reports', href: BASE+'sitereport.html' },
  ]},
  { title:'Workforce & Tasks', items:[
    { wo:'06', tag:'Tasks',  c:'#a855f7', ic:'👷🏻‍♂️', t:'Work Assignments', d:'Assign workers to jobsite tasks', href: BASE+'pixels_work.html' },
    { wo:'05', tag:'Supply', c:'#0ea5e9', ic:'🧰', t:'KKC Supply Work', d:'Manpower Supply to KKC', href: BASE+'kurihara-manpower.html' },
  ]},
  { title:'Safety & Issue', items:[
    { wo:'04', tag:'Issue', c:'#f59e0b', ic:'⛑️', t:'PPE Issue', d:'Assign PPE to workers', href: BASE+'ppe-request.html' },
  ]},
];

const TOOLS = [
  { ic:'👥', t:'Staffs',     d:'Employee management', href: BASE+'pixels-employee-management.html' },
  { ic:'⏱️', t:'ATTNS',      d:'Attendance',          href: BASE+'attns.html' },
  { ic:'⌛', t:'OT Workers', d:'Overtime tracker',    href: BASE+'ot-tracker.html' },
  { ic:'👷🏻‍♂️', t:'Manpower',  d:'Site manpower qty',   href: BASE+'sitemanpowerqty.html' },
  { ic:'🧰', t:'CCV',        d:'Microsoft Form',      href:'https://forms.office.com/r/smX5FFF9Vs' },
];

const ext = 'target="_blank" rel="noopener noreferrer"';

/* menus */
document.getElementById('bottomNav').innerHTML = MENU.map(m =>
  `<a class="nav-btn${m.active?' active':''}" href="${m.href}" ${m.active?'aria-current="page"':''}><span class="ic">${m.ic}</span><span class="lbl">${m.lbl}</span></a>`).join('');
document.getElementById('sideMenu').innerHTML = MENU.map(m =>
  `<a class="side-link${m.active?' active':''}" href="${m.href}" ${m.active?'aria-current="page"':''}><span class="ic">${m.ic}</span>${m.lbl}</a>`).join('');

/* content */
let i = 0;
const cards = GROUPS.map(g => `
  <section class="group">
    <h2>${g.title}</h2>
    <div class="grid">${g.items.map(x => `
      <a class="card" href="${x.href}" ${ext} style="--c:${x.c};--i:${i++}" data-s="${(x.t+' '+x.d+' '+x.tag).toLowerCase()}">
        <div class="badge">${x.ic}</div>
        <div class="info">
          <div class="meta"><span class="tag">${x.tag}</span><span class="wo">WO ${x.wo}</span><span class="live"><i></i>Live</span></div>
          <h3>${x.t}</h3><p>${x.d}</p>
          <span class="go">Open <span>→</span></span>
        </div>
      </a>`).join('')}
    </div>
  </section>`).join('');

const tools = `
  <section class="group">
    <h2>Quick Tools</h2>
    <div class="tiles">${TOOLS.map(x => `
      <a class="tile" href="${x.href}" data-s="${(x.t+' '+x.d).toLowerCase()}">
        <span class="ic">${x.ic}</span><b>${x.t}</b><small>${x.d}</small>
      </a>`).join('')}
    </div>
  </section>`;

document.getElementById('content').innerHTML = cards + tools;

/* search (works on cards + tiles; groups auto-hide via :has) */
const items = [...document.querySelectorAll('[data-s]')];
document.getElementById('q').addEventListener('input', e => {
  const v = e.target.value.trim().toLowerCase();
  items.forEach(el => el.hidden = v && !el.dataset.s.includes(v));
  document.querySelectorAll('.tiles').forEach(t => {
    t.closest('.group').style.display = [...t.children].some(c => !c.hidden) ? '' : 'none';
  });
});

/* clock + greeting */
function tick(){
  const n = new Date();
  document.getElementById('clockTime').textContent = n.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  document.getElementById('clockDate').textContent = n.toLocaleDateString([], {weekday:'long', day:'numeric', month:'short'});
  const h = n.getHours();
  document.getElementById('greet').textContent = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}
tick(); setInterval(tick, 15000);
</script>
</body>
</html>
