<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixels Connect — OT Log</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#131c28;--navy2:#1c2a3a;--amber:#e0a458;--amber-d:#c8873a;--paper:#f6f3ee;--card:#fff;--ink:#1c2530;--soft:#5c6672;--line:#e6e1d8;--good:#4a7c59;--bad:#b6493f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1620;--card:#182130;--ink:#eae6dd;--soft:#9aa4b0;--line:#2a3444}}
:root[data-theme="dark"]{--paper:#0f1620;--card:#182130;--ink:#eae6dd;--soft:#9aa4b0;--line:#2a3444}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;min-height:100%}
.wrap{max-width:480px;margin:0 auto;padding-bottom:48px}
.top{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#f4efe6;padding:22px 20px 20px;border-bottom:3px solid var(--amber)}
.brand{font-size:13px;color:var(--amber);font-weight:700;margin-bottom:4px}
.top h1{margin:0;font-size:22px;font-weight:800}
.who{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:14px;color:#cdd3da}
.btn-ghost{background:none;border:1px solid rgba(244,239,230,.35);color:#f4efe6;padding:7px 14px;border-radius:8px;font:600 13px inherit;font-family:inherit;cursor:pointer}
main{padding:18px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:16px}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin-bottom:6px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font:15px inherit;font-family:inherit;background:var(--paper);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn{width:100%;padding:13px;background:var(--amber);color:#241705;border:none;border-radius:10px;font:800 15px inherit;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.6}
.btn-outline{width:100%;padding:11px;background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;font:700 14px inherit;font-family:inherit;cursor:pointer;margin-top:8px}
.err{color:var(--bad);font-size:13px;font-weight:600;margin:-6px 0 14px}
.msg{background:rgba(74,124,89,.14);border:1px solid rgba(74,124,89,.4);color:var(--good);padding:11px 13px;border-radius:10px;font-size:13.5px;font-weight:600;margin-bottom:16px}
.hint{font-size:12.5px;color:var(--soft);margin:-8px 0 14px}
.entry{border-bottom:1px solid var(--line);padding:12px 0}.entry:last-child{border:none}
.row1{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px}.hrs{color:var(--amber-d);font-variant-numeric:tabular-nums}
.meta{font-size:12.5px;color:var(--soft);margin-top:3px}
.empty{color:var(--soft);text-align:center;padding:20px 0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .n{font-weight:800;font-size:17px}.stat .l{font-size:12px;color:var(--soft);margin-top:2px}
.tbl-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--soft);font-size:11.5px}
td.r,th.r{text-align:right}.del{background:none;border:none;color:var(--bad);cursor:pointer;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== PASTE YOUR VALUES HERE ======
const SUPABASE_URL = "https://jofbyyznznfcvhebpwsx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IsMcjJM6whAVPgjpJV4cGg_yVxgIce-";
// ====================================
const WORKERS = ["NI SOE OO","MYO MIN LATT","TUN MIN LATT","BO BO ZAW","AUNG WAI PHYO","TUN TUN WIN","SI THU HTUN"];
const OT_RATE = 4.5;
let sb = null, bootErr = '';
if(SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')) bootErr = 'Paste your Supabase URL and anon key near the top of the file.';
else if(!window.supabase) bootErr = 'The Supabase library did not load. Check your internet connection or ad blocker.';
else { try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ bootErr = 'Could not start Supabase: '+e.message; } }

let user = null, entries = [], ui = {err:'', msg:'', busy:false, month:new Date().toISOString().slice(0,7)};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtDate = s => s.split('-').reverse().join('/');
const fmtTime = iso => new Date(iso).toLocaleString('en-SG',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const role = () => user?.app_metadata?.role;
const name = () => user?.app_metadata?.name || user?.email;

async function init(){
  render();
  if(bootErr){ ui.err = bootErr; render(); return; }
  try{
    const { data } = await sb.auth.getSession();
    user = data.session?.user || null;
    if(user) await load();
  }catch(e){ ui.err = 'Could not connect: '+e.message; }
  render();
}
async function load(){
  let q = sb.from('ot_entries').select('*').order('approved_at',{ascending:false});
  if(role()==='admin'){
    const [y,m] = ui.month.split('-').map(Number);
    q = q.gte('work_date', ui.month+'-01').lt('work_date', (m===12?(y+1)+'-01':y+'-'+pad(m+1))+'-01');
  } else q = q.limit(25);
  const { data, error } = await q;
  if(error){ ui.err = 'Could not load entries: '+error.message; entries = []; }
  else entries = data;
}
async function login(){
  if(!sb){ ui.err = bootErr; render(); return; }
  ui.busy = true; ui.err=''; render();
  const { data, error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('pw').value });
  ui.busy = false;
  if(error){ ui.err = 'Wrong email or password.'; render(); return; }
  user = data.user;
  if(!role()){ ui.err = 'This account has no role yet. Ask the admin to set it up.'; await sb.auth.signOut(); user = null; render(); return; }
  await load(); render();
}
async function logout(){ await sb.auth.signOut(); user=null; entries=[]; ui.err=ui.msg=''; render(); }

async function submitEntry(){
  const date = $('e-date').value, worker = $('e-worker').value, hours = parseFloat($('e-hours').value);
  const today = new Date(); today.setHours(0,0,0,0);
  const min = new Date(today); min.setDate(min.getDate()-1);
  const chosen = new Date(date+'T00:00:00');
  ui.msg = '';
  if(!date || isNaN(chosen)) ui.err='Pick a valid date.';
  else if(chosen<min || chosen>today) ui.err='OT can only be logged for today or yesterday.';
  else if(!worker) ui.err='Pick a worker.';
  else if(!hours || hours<=0 || hours>24) ui.err='Enter valid OT hours.';
  else ui.err='';
  if(ui.err){ render(); return; }
  $('submit-btn').disabled = true;
  const { error } = await sb.from('ot_entries').insert({ work_date:date, worker, hours, supervisor:name() });
  if(error){ ui.err = 'Could not save: '+error.message; render(); return; }
  ui.msg = 'Saved '+hours+' hrs for '+worker+'.';
  await load(); render();
}
async function deleteEntry(id){
  if(!confirm('Remove this entry?')) return;
  const { error } = await sb.from('ot_entries').delete().eq('id', id);
  if(error) ui.err = 'Could not remove: '+error.message;
  await load(); render();
}
function csv(){
  let t = 'Date,Worker,Hours,Supervisor,Approved At,Pay (SGD)\n', total = 0;
  entries.forEach(e=>{ total += Number(e.hours); t += [e.work_date,e.worker,e.hours,e.supervisor,e.approved_at,(e.hours*OT_RATE).toFixed(2)].join(',')+'\n'; });
  t += '\nTotal,,'+total+',,,'+(total*OT_RATE).toFixed(2)+'\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t],{type:'text/csv'}));
  a.download = 'OT-report-'+ui.month+'.csv'; a.click();
}

function top(){
  return `<div class="top"><div class="brand">Pixels Connect</div><h1>OT &amp; Attendance</h1>${user?`<div class="who"><span>Signed in as <b>${esc(name())}</b>${role()==='admin'?' · Admin':''}</span><button class="btn-ghost" id="logout">Log out</button></div>`:''}</div>`;
}
function renderLogin(){
  return top()+`<main><div class="card"><h2>Sign in</h2>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    ${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}
    <button class="btn" id="login" ${ui.busy?'disabled':''}>${ui.busy?'Signing in…':'Log in'}</button></div></main>`;
}
function renderSupervisor(){
  const t = new Date(); t.setHours(0,0,0,0); const y = new Date(t); y.setDate(y.getDate()-1);
  return top()+`<main>${ui.msg?`<div class="msg">${esc(ui.msg)}</div>`:''}
  <div class="card"><h2>Log OT hours</h2>
    <div class="field"><label>Date</label><input type="date" id="e-date" min="${dstr(y)}" max="${dstr(t)}" value="${dstr(t)}"></div>
    <div class="hint">You can only log today or yesterday's OT.</div>
    <div class="field"><label>Worker</label><select id="e-worker"><option value="">Select worker</option>${WORKERS.map(w=>`<option>${esc(w)}</option>`).join('')}</select></div>
    <div class="field"><label>OT hours</label><input type="number" id="e-hours" step="0.5" min="0" max="24" placeholder="e.g. 2.5"></div>
    ${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}
    <button class="btn" id="submit-btn">Submit OT entry</button></div>
  <div class="card"><h2>Your recent entries</h2>${entries.length?entries.map(e=>`<div class="entry"><div class="row1"><span>${esc(e.worker)}</span><span class="hrs">${e.hours} hrs</span></div><div class="meta">${fmtDate(e.work_date)} · saved ${fmtTime(e.approved_at)}</div></div>`).join(''):'<div class="empty">No entries logged yet.</div>'}</div></main>`;
}
function renderAdmin(){
  const by = {}; WORKERS.forEach(w=>by[w]=0); entries.forEach(e=>by[e.worker]=(by[e.worker]||0)+Number(e.hours));
  const tot = entries.reduce((s,e)=>s+Number(e.hours),0);
  return top()+`<main>${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}
  <div class="card"><h2>Monthly report</h2>
    <div class="field"><label>Month</label><input type="month" id="adm-month" value="${ui.month}"></div>
    <div class="grid2">${Object.keys(by).map(w=>`<div class="stat"><div class="n">${by[w].toFixed(1)} hrs</div><div class="l">${esc(w)} · $${(by[w]*OT_RATE).toFixed(2)}</div></div>`).join('')}</div>
    <div class="stat" style="margin-top:6px"><div class="n">${tot.toFixed(1)} hrs · $${(tot*OT_RATE).toFixed(2)}</div><div class="l">All workers · $${OT_RATE.toFixed(2)}/hr</div></div>
    <button class="btn-outline" id="csv-btn">Download CSV report</button></div>
  <div class="card"><h2>All entries this month</h2>${entries.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Worker</th><th class="r">Hrs</th><th>Supervisor</th><th>Saved</th><th class="r">Pay</th><th></th></tr></thead><tbody>${entries.map(e=>`<tr><td>${fmtDate(e.work_date)}</td><td>${esc(e.worker)}</td><td class="r">${e.hours}</td><td>${esc(e.supervisor)}</td><td>${fmtTime(e.approved_at)}</td><td class="r">$${(e.hours*OT_RATE).toFixed(2)}</td><td><button class="del" data-id="${e.id}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No entries this month yet.</div>'}</div></main>`;
}
function render(){
  const app = $('app');
  if(!user){ app.innerHTML = renderLogin(); $('login').onclick = login; $('pw').onkeydown = e=>{ if(e.key==='Enter') login(); }; return; }
  if(role()==='admin'){
    app.innerHTML = renderAdmin();
    $('adm-month').onchange = async e=>{ ui.month = e.target.value; await load(); render(); };
    $('csv-btn').onclick = csv;
    document.querySelectorAll('.del').forEach(b=>b.onclick=()=>deleteEntry(b.dataset.id));
  } else { app.innerHTML = renderSupervisor(); $('submit-btn').onclick = submitEntry; }
  $('logout').onclick = logout;
}
init();
</script>
</body>
</html>
