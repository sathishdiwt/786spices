<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixels Connect — OT Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#131c28; --navy-2:#1c2a3a; --amber:#e0a458; --amber-dark:#c8873a;
  --paper:#f6f3ee; --card:#ffffff; --ink:#1c2530; --ink-soft:#5c6672;
  --line:#e6e1d8; --good:#4a7c59; --bad:#b6493f;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#0f1620; --card:#182130; --ink:#eae6dd; --ink-soft:#9aa4b0; --line:#2a3444; }
}
:root[data-theme="dark"]{ --paper:#0f1620; --card:#182130; --ink:#eae6dd; --ink-soft:#9aa4b0; --line:#2a3444; }
*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
.wrap{max-width:480px; margin:0 auto; padding:0 0 48px;}
.top{
  background:linear-gradient(160deg,var(--navy),var(--navy-2));
  color:#f4efe6; padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 20px;
  border-bottom:3px solid var(--amber);
}
.top .brand{font-size:13px; letter-spacing:.02em; color:var(--amber); font-weight:700; margin-bottom:4px;}
.top h1{margin:0; font-size:22px; font-weight:800; line-height:1.2;}
.top .who{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.top .who span{font-size:14px; color:#cdd3da;}
.top .who b{color:#fff; font-weight:700;}
.btn-ghost{background:none; border:1px solid rgba(244,239,230,.35); color:#f4efe6; padding:7px 14px; border-radius:8px; font-size:13px; font-family:inherit; font-weight:600; cursor:pointer;}
.btn-ghost:active{background:rgba(244,239,230,.12);}
main{padding:18px 20px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px;}
.card h2{margin:0 0 14px; font-size:16px; font-weight:700;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
input,select{
  width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px;
  font-family:inherit; font-size:15px; background:var(--paper); color:var(--ink);
}
input:focus,select:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
.seg{display:flex; background:var(--paper); border:1.5px solid var(--line); border-radius:10px; padding:3px; margin-bottom:16px;}
.seg button{flex:1; padding:9px; border:none; background:none; border-radius:8px; font-family:inherit; font-weight:700; font-size:14px; color:var(--ink-soft); cursor:pointer;}
.seg button.active{background:var(--navy); color:#f4efe6;}
.btn{
  width:100%; padding:13px; background:var(--amber); color:#241705; border:none; border-radius:10px;
  font-family:inherit; font-weight:800; font-size:15px; cursor:pointer; letter-spacing:.01em;
}
.btn:active{background:var(--amber-dark);}
.btn-outline{width:100%; padding:11px; background:none; border:1.5px solid var(--line); color:var(--ink); border-radius:10px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; margin-top:8px;}
.err{color:var(--bad); font-size:13px; font-weight:600; margin:-6px 0 14px;}
.msg{background:#eaf3ec; border:1px solid #c6e0cb; color:var(--good); padding:11px 13px; border-radius:10px; font-size:13.5px; font-weight:600; margin-bottom:16px;}
:root[data-theme="dark"] .msg, @media (prefers-color-scheme: dark){ .msg{background:#16241a;border-color:#2a4632;} }
.hint{font-size:12.5px; color:var(--ink-soft); margin-top:-8px; margin-bottom:14px;}
.entry{border-bottom:1px solid var(--line); padding:12px 0;}
.entry:last-child{border-bottom:none;}
.entry .row1{display:flex; justify-content:space-between; font-weight:700; font-size:14.5px;}
.entry .hrs{font-variant-numeric:tabular-nums; color:var(--amber-dark);}
.entry .meta{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
.empty{color:var(--ink-soft); font-size:14px; text-align:center; padding:20px 0;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px;}
.stat .n{font-weight:800; font-size:17px; font-variant-numeric:tabular-nums;}
.stat .l{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:480px;}
th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap;}
th{color:var(--ink-soft); font-weight:700; font-size:11.5px;}
td.hrs, th.hrs{font-variant-numeric:tabular-nums; text-align:right;}
.del{background:none; border:none; color:var(--bad); cursor:pointer; font-size:12px; font-weight:700; padding:2px 6px;}
.total-row td{font-weight:800; border-top:2px solid var(--ink); border-bottom:none;}
footer{text-align:center; color:var(--ink-soft); font-size:12px; padding:10px 20px 4px;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty" style="padding:60px 0">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== CONFIG — paste your anon (publishable) key below ======
const SUPABASE_URL = 'https://jofbyyznznfcvhebpwsx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IsMcjJM6whAVPgjpJV4cGg_yVxgIce-';

const WORKERS = ["NI SOE OO","MYO MIN LATT","TUN MIN LATT","BO BO ZAW","AUNG WAI PHYO","TUN TUN WIN","SI THU HTUN"];
const SUPERVISORS = ["Shakirul","Mia Hasan","Miah Nayon","Miah Rashed","ELIAS MD"];
const OT_RATE = 4.5;
// ==============================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let entries = [];
let session = null;
let busy = false;
let ui = { tab:'supervisor', err:'', msg:'', adminMonth: monthStr(new Date()) };

function pad(n){return String(n).padStart(2,'0');}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function monthStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function today0(){const d=new Date(); d.setHours(0,0,0,0); return d;}
function fmtDate(s){ const [y,m,dd]=s.split('-'); return dd+'/'+m+'/'+y; }
function fmtTime(iso){ const d=new Date(iso); return d.toLocaleString('en-SG',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadEntries(){
  const { data, error } = await db.rpc('ot_list', { p_name: session.name, p_pw: session.pw });
  if(error){ ui.err='Could not load entries: '+error.message; return; }
  entries = (data||[]).map(r=>({ id:r.id, date:r.work_date, worker:r.worker, hours:Number(r.hours), supervisor:r.supervisor, approvedAt:r.approved_at }));
}

async function login(role){
  if(busy) return;
  let name, pw;
  if(role==='supervisor'){
    name = document.getElementById('sup-name').value;
    pw = document.getElementById('sup-pw').value;
  } else {
    name = 'Admin';
    pw = document.getElementById('admin-pw').value;
  }
  busy = true; ui.err='';
  const { data, error } = await db.rpc('ot_login', { p_name: name, p_pw: pw });
  busy = false;
  if(error){ ui.err='Could not connect: '+error.message; render(); return; }
  if(!data){ ui.err = role==='admin' ? 'Wrong admin password.' : 'Wrong name or password.'; render(); return; }
  session = { role: data, name, pw };
  await loadEntries();
  render();
}

function logout(){
  session = null; entries = [];
  ui = {tab:'supervisor',err:'',msg:'',adminMonth:monthStr(new Date())};
  render();
}

async function submitEntry(){
  if(busy) return;
  const date = document.getElementById('e-date').value;
  const worker = document.getElementById('e-worker').value;
  const hours = parseFloat(document.getElementById('e-hours').value);
  const min = new Date(today0()); min.setDate(min.getDate()-1);
  const max = today0();
  const chosen = new Date(date+'T00:00:00');
  if(!date || isNaN(chosen.getTime())){ ui.err='Pick a valid date.'; render(); return; }
  if(chosen < min || chosen > max){ ui.err='OT can only be logged for today or yesterday.'; render(); return; }
  if(!worker){ ui.err='Pick a worker.'; render(); return; }
  if(!hours || hours<=0 || hours>24){ ui.err='Enter valid OT hours.'; render(); return; }
  busy = true;
  const { data, error } = await db.rpc('ot_add', { p_name: session.name, p_pw: session.pw, p_date: date, p_worker: worker, p_hours: hours });
  busy = false;
  if(error){ ui.err='Could not save: '+error.message; render(); return; }
  await loadEntries();
  ui.err=''; ui.msg='Logged '+hours+' hrs for '+worker+' — approved by '+session.name+' at '+fmtTime(data.approved_at)+'.';
  render();
}

async function deleteEntry(id){
  if(!session || session.role!=='admin') return;
  const { error } = await db.rpc('ot_remove', { p_name: session.name, p_pw: session.pw, p_id: id });
  if(error){ ui.err='Could not remove: '+error.message; }
  await loadEntries();
  render();
}

function setAdminMonth(v){ ui.adminMonth=v; render(); }
function setTab(t){ ui.tab=t; ui.err=''; render(); }

function downloadCsv(){
  const rows = entriesForMonth(ui.adminMonth);
  const totalHrs = rows.reduce((s,e)=>s+e.hours,0);
  let csv = 'Date,Worker,Hours,Supervisor,Approved At,Pay (SGD)\n';
  rows.forEach(e=>{ csv += [e.date, '"'+e.worker+'"', e.hours, '"'+e.supervisor+'"', e.approvedAt, (e.hours*OT_RATE).toFixed(2)].join(',')+'\n'; });
  csv += '\nTotal,,'+totalHrs+',,,'+(totalHrs*OT_RATE).toFixed(2)+'\n';
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'OT-report-'+ui.adminMonth+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function entriesForMonth(m){ return entries.filter(e=>e.date.startsWith(m)).sort((a,b)=> a.date<b.date?1:-1); }

function render(){
  const app = document.getElementById('app');
  if(!session){ app.innerHTML = renderLogin(); bindLogin(); return; }
  if(session.role==='supervisor'){ app.innerHTML = renderTop()+renderSupervisor(); bindSupervisor(); }
  else { app.innerHTML = renderTop()+renderAdmin(); bindAdmin(); }
}

function renderTop(){
  return `<div class="top"><div class="brand">Pixels Connect</div>
    <h1>OT &amp; Attendance</h1>
    <div class="who"><span>Signed in as <b>${esc(session.name)}</b>${session.role==='admin'?' · Admin':''}</span>
    <button class="btn-ghost" id="logout-btn">Log out</button></div></div>`;
}

function renderLogin(){
  const supOpts = SUPERVISORS.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  return `<div class="top"><div class="brand">Pixels Connect</div><h1>OT &amp; Attendance</h1></div>
  <main>
    <div class="seg">
      <button id="tab-sup" class="${ui.tab==='supervisor'?'active':''}">Supervisor</button>
      <button id="tab-adm" class="${ui.tab==='admin'?'active':''}">Admin</button>
    </div>
    <div class="card">
      ${ui.tab==='supervisor' ? `
        <h2>Supervisor sign in</h2>
        <div class="field"><label>Your name</label>
          <select id="sup-name">${supOpts}</select></div>
        <div class="field"><label>Password</label>
          <input type="password" id="sup-pw" placeholder="Enter your password"></div>
        ${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}
        <button class="btn" id="do-login">Log in</button>
      ` : `
        <h2>Admin sign in</h2>
        <div class="field"><label>Admin password</label>
          <input type="password" id="admin-pw" placeholder="Enter admin password"></div>
        ${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}
        <button class="btn" id="do-login">Log in</button>
      `}
    </div>
  </main>
  <footer>Each supervisor has their own password · OT entries can only be logged for today or yesterday.</footer>`;
}
function bindLogin(){
  document.getElementById('tab-sup').onclick=()=>setTab('supervisor');
  document.getElementById('tab-adm').onclick=()=>setTab('admin');
  document.getElementById('do-login').onclick=()=>login(ui.tab);
}

function renderSupervisor(){
  const min = new Date(today0()); min.setDate(min.getDate()-1);
  const max = today0();
  const mine = entries.filter(e=>e.supervisor===session.name).sort((a,b)=> a.approvedAt<b.approvedAt?1:-1).slice(0,25);
  const workerOpts = WORKERS.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');
  return `<main>
    ${ui.msg?`<div class="msg">${esc(ui.msg)}</div>`:''}
    <div class="card">
      <h2>Log OT hours</h2>
      <div class="field"><label>Date</label>
        <input type="date" id="e-date" min="${dstr(min)}" max="${dstr(max)}" value="${dstr(max)}"></div>
      <div class="hint">You can only log today or yesterday's OT.</div>
      <div class="field"><label>Worker</label><select id="e-worker"><option value="">Select worker</option>${workerOpts}</select></div>
      <div class="field"><label>OT hours</label><input type="number" id="e-hours" step="0.5" min="0" max="24" placeholder="e.g. 2.5"></div>
      ${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}
      <button class="btn" id="submit-btn">Submit OT entry</button>
    </div>
    <div class="card">
      <h2>Your recent entries</h2>
      ${mine.length? mine.map(e=>`
        <div class="entry"><div class="row1"><span>${esc(e.worker)}</span><span class="hrs">${e.hours} hrs</span></div>
        <div class="meta">${fmtDate(e.date)} · approved by ${esc(e.supervisor)} at ${fmtTime(e.approvedAt)}</div></div>
      `).join('') : `<div class="empty">No entries logged yet.</div>`}
    </div>
  </main>`;
}
function bindSupervisor(){
  document.getElementById('logout-btn').onclick=logout;
  document.getElementById('submit-btn').onclick=submitEntry;
}

function renderAdmin(){
  const rows = entriesForMonth(ui.adminMonth);
  const totalsByWorker = {};
  WORKERS.forEach(w=>totalsByWorker[w]=0);
  rows.forEach(e=>{ totalsByWorker[e.worker]=(totalsByWorker[e.worker]||0)+e.hours; });
  const grandHrs = rows.reduce((s,e)=>s+e.hours,0);
  const grandPay = grandHrs*OT_RATE;
  const statCards = WORKERS.map(w=>{
    const h=totalsByWorker[w]||0;
    return `<div class="stat"><div class="n">${h.toFixed(1)} hrs</div><div class="l">${esc(w)} · $${(h*OT_RATE).toFixed(2)}</div></div>`;
  }).join('');
  const tblRows = rows.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.worker)}</td><td class="hrs">${e.hours}</td><td>${esc(e.supervisor)}</td><td>${fmtTime(e.approvedAt)}</td><td class="hrs">$${(e.hours*OT_RATE).toFixed(2)}</td><td><button class="del" data-id="${esc(e.id)}">Remove</button></td></tr>`).join('');
  return `<main>
    ${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}
    <div class="card">
      <h2>Monthly report</h2>
      <div class="field"><label>Month</label><input type="month" id="adm-month" value="${ui.adminMonth}"></div>
      <div class="grid2">${statCards}</div>
      <div class="stat" style="margin-top:6px;"><div class="n">${grandHrs.toFixed(1)} hrs · $${grandPay.toFixed(2)}</div><div class="l">All workers combined · $${OT_RATE.toFixed(2)}/hr</div></div>
      <button class="btn-outline" id="csv-btn">Download CSV report</button>
    </div>
    <div class="card">
      <h2>All entries this month</h2>
      ${rows.length? `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Worker</th><th class="hrs">Hrs</th><th>Supervisor</th><th>Approved</th><th class="hrs">Pay</th><th></th></tr></thead>
      <tbody>${tblRows}</tbody></table></div>` : `<div class="empty">No entries this month yet.</div>`}
    </div>
  </main>`;
}
function bindAdmin(){
  document.getElementById('logout-btn').onclick=logout;
  document.getElementById('adm-month').onchange=(e)=>setAdminMonth(e.target.value);
  document.getElementById('csv-btn').onclick=downloadCsv;
  document.querySelectorAll('.del').forEach(b=> b.onclick=()=>deleteEntry(b.getAttribute('data-id')));
}

render();
</script>
</body>
</html>
